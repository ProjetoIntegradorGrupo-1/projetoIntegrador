<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
    <style>
        .foto-grande { width: 140px; height: 140px; }
        .foto-grande .axion-avatar { width: 140px !important; height: 140px !important; font-size: 52px !important; border: 4px solid #fff; box-shadow: 0 4px 16px rgba(15, 23, 42, .15); }
        .dado { font-size: .78rem; color: var(--axion-muted); }
        .dado + div { font-weight: 600; margin-bottom: .75rem; }
    </style>
</head>

<body data-secao="perfil" data-titulo="">
    <main class="axion-web-container">
        <div class="row g-3" style="max-width: 1000px;">
            <!-- Foto -->
            <div class="col-lg-4">
                <div class="axion-form-card text-center h-100">
                    <div class="foto-grande mx-auto mb-3" id="foto-atual"></div>
                    <h1 class="h5 fw-bold mb-0" id="nome"></h1>
                    <div class="text-muted small mb-3" id="perfil"></div>

                    <input type="file" id="input-foto" accept="image/*" class="d-none">
                    <div class="d-grid gap-2">
                        <label for="input-foto" class="btn btn-primary"><i class="bi bi-camera me-1"></i>Escolher foto</label>
                        <button type="button" class="btn btn-outline-danger btn-sm d-none" id="btn-remover" onclick="removerFoto()"><i class="bi bi-trash me-1"></i>Remover foto</button>
                    </div>
                    <div class="form-text mt-2">JPG, PNG ou WEBP. A foto é recortada em quadrado automaticamente.</div>
                    <div id="msg-foto" class="mt-2"></div>
                </div>
            </div>

            <!-- Dados e senha -->
            <div class="col-lg-8">
                <div class="axion-form-card mb-3">
                    <div class="axion-section-title"><i class="bi bi-person-vcard"></i> Meus dados</div>
                    <div class="row" id="dados"><div class="text-muted small">Carregando...</div></div>
                    <div class="form-text">Para alterar estes dados, fale com o seu supervisor ou com o administrador.</div>
                </div>

                <div class="axion-form-card">
                    <div class="axion-section-title"><i class="bi bi-key"></i> Trocar senha</div>
                    <form id="form-senha" onsubmit="trocarSenha(event)">
                        <div class="row g-2">
                            <div class="col-md-4"><input type="password" class="form-control" id="senha-atual" placeholder="Senha atual" autocomplete="current-password" required></div>
                            <div class="col-md-4"><input type="password" class="form-control" id="senha-nova" placeholder="Nova senha (mín. 6)" minlength="6" autocomplete="new-password" required></div>
                            <div class="col-md-4"><input type="password" class="form-control" id="senha-conf" placeholder="Repita a nova senha" minlength="6" autocomplete="new-password" required></div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div id="msg-senha" class="small"></div>
                            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-check2 me-1"></i>Salvar nova senha</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        let csrf = '';
        let meusDados = null;
        const nomesPerfil = { admin: 'Administrador', supervisor: 'Supervisor', motorista: 'Motorista', cliente: 'Cliente' };
        const dataBR = (d) => d ? d.slice(0, 10).split('-').reverse().join('/') : '-';

        function mostrarFoto(url) {
            document.getElementById('foto-atual').innerHTML = axionAvatar(url, meusDados.nome, 140);
            document.getElementById('btn-remover').classList.toggle('d-none', !url);
            // Atualiza também a foto do cabeçalho
            document.querySelectorAll('.axion-navbar .axion-avatar').forEach(el => { el.outerHTML = axionAvatar(url, meusDados.nome, 34); });
        }

        function aviso(id, tipo, texto) {
            document.getElementById(id).innerHTML = `<div class="alert alert-${tipo} py-2 small mb-0">${texto}</div>`;
        }

        // Recorta no centro em quadrado e reduz para 400x400 antes de enviar (arquivo pequeno e leve)
        function prepararFoto(arquivo) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const lado = Math.min(img.width, img.height);
                    const c = document.createElement('canvas');
                    c.width = c.height = 400;
                    c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, 400, 400);
                    c.toBlob(b => b ? resolve(b) : reject(), 'image/jpeg', 0.88);
                    URL.revokeObjectURL(img.src);
                };
                img.onerror = reject;
                img.src = URL.createObjectURL(arquivo);
            });
        }

        document.getElementById('input-foto').addEventListener('change', async (ev) => {
            const arq = ev.target.files[0];
            ev.target.value = '';
            if (!arq) return;
            if (!arq.type.startsWith('image/')) { aviso('msg-foto', 'danger', 'Escolha um arquivo de imagem.'); return; }
            aviso('msg-foto', 'secondary', 'Enviando foto...');
            try {
                const blob = await prepararFoto(arq);
                const fd = new FormData();
                fd.append('csrf', csrf);
                fd.append('foto', blob, 'perfil.jpg');
                const r = await fetch('backend/api.php?acao=salvar_foto_perfil', { method: 'POST', body: fd, headers: { Accept: 'application/json' } });
                const j = await r.json();
                if (!j.sucesso) { aviso('msg-foto', 'danger', axionEsc(j.erro || 'Não foi possível salvar a foto.')); return; }
                mostrarFoto(j.foto_url);
                aviso('msg-foto', 'success', 'Foto atualizada.');
            } catch (e) {
                aviso('msg-foto', 'danger', 'Não foi possível ler esta imagem.');
            }
        });

        async function removerFoto() {
            if (!confirm('Remover a sua foto de perfil?')) return;
            const fd = new FormData();
            fd.append('csrf', csrf);
            const j = await (await fetch('backend/api.php?acao=remover_foto_perfil', { method: 'POST', body: fd, headers: { Accept: 'application/json' } })).json();
            if (j.sucesso) { mostrarFoto(null); aviso('msg-foto', 'success', 'Foto removida.'); }
        }

        async function trocarSenha(ev) {
            ev.preventDefault();
            const nova = document.getElementById('senha-nova').value;
            if (nova !== document.getElementById('senha-conf').value) { aviso('msg-senha', 'danger', 'As duas senhas novas não são iguais.'); return; }
            const fd = new FormData();
            fd.append('csrf', csrf);
            fd.append('senha_atual', document.getElementById('senha-atual').value);
            fd.append('senha_nova', nova);
            const j = await (await fetch('backend/api.php?acao=trocar_senha', { method: 'POST', body: fd, headers: { Accept: 'application/json' } })).json();
            if (!j.sucesso) { aviso('msg-senha', 'danger', axionEsc(j.erro || 'Não foi possível trocar a senha.')); return; }
            document.getElementById('form-senha').reset();
            aviso('msg-senha', 'success', 'Senha alterada. Use a nova senha no próximo login.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const ctx = await AxionSessao.pronta;
            if (!ctx) return;
            csrf = ctx.csrf;
            const j = await (await fetch('backend/api.php?acao=meus_dados', { headers: { Accept: 'application/json' } })).json();
            meusDados = j.dados;
            const d = meusDados;
            document.getElementById('nome').textContent = d.nome;
            document.getElementById('perfil').textContent = nomesPerfil[d.perfil] || d.perfil;
            mostrarFoto(d.foto_url);
            const campos = [
                ['E-mail', d.email], ['CPF', d.cpf_matricula], ['Telefone', d.telefone || '-'],
                ['Cidade', d.cidade ? `${d.cidade}/${d.estado || ''}` : '-'],
            ];
            if (d.perfil === 'motorista') campos.push(['Supervisor responsável', d.supervisor_nome || 'Não definido']);
            if (d.perfil === 'motorista' || d.perfil === 'cliente') {
                campos.push(['CNH', d.cnh ? `${d.cnh} · categoria ${d.categoria_cnh || '-'}` : '-']);
                campos.push(['Validade da CNH', dataBR(d.validade_cnh)]);
            }
            document.getElementById('dados').innerHTML = campos.map(([r, v]) =>
                `<div class="col-md-6"><div class="dado">${r}</div><div>${axionEsc(v)}</div></div>`).join('');
        });
    </script>
</body>

</html>
