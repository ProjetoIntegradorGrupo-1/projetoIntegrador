<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Veículo - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 600px; width: 100%;">
            <h1 class="h4 text-center mb-4">Editar Veículo</h1>

            <!-- 1. BLOCO DE BUSCA DO VEÍCULO -->
            <form action="buscar_veiculo.php" method="get" class="mb-4 p-3 bg-light border rounded">
                <label for="select-veiculo" class="form-label fw-bold">Selecione o Veículo para Editar</label>
                <div class="input-group">
                    <select id="select-veiculo" name="id_veiculo" class="form-select" required>
                        <option value="" selected disabled>Escolha um veículo cadastrado...</option>
                        <option value="1">ABC-1D23 | VW Gol - Prata</option>
                        <option value="2">XYZ-9876 | Fiat Uno - Branco</option>
                    </select>
                    <button class="btn btn-outline-primary" type="submit">Carregar Dados</button>
                </div>
            </form>

            <hr class="my-4">

            <!-- 2. FORMULÁRIO DE EDIÇÃO DO VEÍCULO -->
            <form action="processar_edicao_veiculo.php" method="post">
                <!-- ID Oculto do Veículo para o Backend -->
                <input type="hidden" name="id_veiculo" value="1">

                <div class="row">
                    <!-- Marca -->
                    <div class="col-md-6 mb-3">
                        <label for="marca" class="form-label">Marca</label>
                        <input type="text" id="marca" name="marca" class="form-control" value="Volkswagen" required>
                    </div>

                    <!-- Modelo -->
                    <div class="col-md-6 mb-3">
                        <label for="modelo" class="form-label">Modelo</label>
                        <input type="text" id="modelo" name="modelo" class="form-control" value="Gol 1.0" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Ano -->
                    <div class="col-md-6 mb-3">
                        <label for="ano" class="form-label">Ano</label>
                        <input type="number" id="ano" name="ano" class="form-control" value="2022" min="1900" max="2099" required>
                    </div>

                    <!-- Placa -->
                    <div class="col-md-6 mb-3">
                        <label for="placa" class="form-label">Placa</label>
                        <input type="text" id="placa" name="placa" class="form-control text-uppercase" value="ABC1D23" maxlength="7" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Cor -->
                    <div class="col-md-6 mb-3">
                        <label for="cor" class="form-label">Cor</label>
                        <input type="text" id="cor" name="cor" class="form-control" value="Prata" required>
                    </div>

                    <!-- Km Rodado -->
                    <div class="col-md-6 mb-3">
                        <label for="kmrodado" class="form-label">Km Rodado</label>
                        <input type="number" id="kmrodado" name="kmrodado" class="form-control" value="45000" min="0" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Renavam -->
                    <div class="col-md-6 mb-3">
                        <label for="renavam" class="form-label">Renavam</label>
                        <input type="text" id="renavam" name="renavam" class="form-control" value="12345678901" required>
                    </div>

                    <!-- Chassi -->
                    <div class="col-md-6 mb-3">
                        <label for="chassi" class="form-label">Chassi</label>
                        <input type="text" id="chassi" name="chassi" class="form-control text-uppercase" value="9BWZZZ377VT000000" required>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2 mt-3">
                    <input type="submit" value="Salvar Alterações" class="btn btn-primary">
                    <a href="oqfazer.php" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
