<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preencher Checklist</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 600px; width: 100%;">
            <h1 class="h4 text-center mb-4">Preencher Checklist</h1>

            <form action="processar_cadastro_checklist.php" method="post">
                <div class="row">
                    <!-- Placa do Veículo -->
                    <div class="col-md-6 mb-3">
                        <label for="placadoveiculo" class="form-label">Placa do Veículo</label>
                        <input type="text" id="placadoveiculo" name="placadoveiculo" class="form-control text-uppercase" placeholder="Ex: ABC1D23" maxlength="7" required autofocus>
                    </div>

                    <!-- Nome do Motorista -->
                    <div class="col-md-6 mb-3">
                        <label for="nomedomotorista" class="form-label">Nome do Motorista</label>
                        <input type="text" id="nomedomotorista" name="nomedomotorista" class="form-control" placeholder="Nome do motorista" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Data da Vistoria -->
                    <div class="col-md-6 mb-3">
                        <label for="datavistoria" class="form-label">Data da Vistoria</label>
                        <input type="date" id="datavistoria" name="datavistoria" class="form-control" required>
                    </div>

                    <!-- Hora da Vistoria -->
                    <div class="col-md-6 mb-3">
                        <label for="horavistoria" class="form-label">Hora da Vistoria</label>
                        <input type="time" id="horavistoria" name="horavistoria" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Km Rodado -->
                    <div class="col-md-6 mb-3">
                        <label for="kmrodado" class="form-label">Km Rodado</label>
                        <input type="number" id="kmrodado" name="kmrodado" class="form-control" placeholder="Ex: 45000" min="0" required>
                    </div>

                    <!-- Nome do Vistoriador -->
                    <div class="col-md-6 mb-3">
                        <label for="nomevistoriador" class="form-label">Nome do Vistoriador</label>
                        <input type="text" id="nomevistoriador" name="nomevistoriador" class="form-control" placeholder="Nome do vistoriador" required>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2 mt-3">
                    <input type="submit" value="Cadastrar" class="btn btn-primary">
                    <a href="oqfazer.html" class="btn btn-outline-secondary">Voltar ao Menu</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
