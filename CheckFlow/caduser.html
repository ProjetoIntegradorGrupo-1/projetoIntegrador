                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite o nome" required autofocus>

                </div>

                    <div class="col-md-4 mb-3">

                            <option value="Outro">Outro</option>

                <div class="row">

                        <input type="text" id="numero" name="numero" class="form-control" placeholder="N°" required>
