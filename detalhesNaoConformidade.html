<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Adicionais do Veículo - Axion</title>
    <!-- CSS do Bootstrap e Ícones FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <!-- TOAST DE RECOMENDAÇÃO (Disparado quando houver não conformidade) -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div id="toastNaoConformidade" class="toast align-items-center text-white bg-warning border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body text-dark">
                    <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
                    <strong>Atenção:</strong> Resposta fora do padrão esperado. Favor registrar fotos e a descrição do problema.
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 600px; width: 100%;">
            <h1 class="h4 text-center mb-1">Informações adicionais das condições do veículo</h1>
            <p class="text-center text-muted small mb-3" id="resumo-vistoria">Carregando vistoria...</p>

            <div id="itens-fora-padrao" class="mb-3"></div>

            <form action="backend/api.php?acao=salvar_nao_conformidade" method="post" enctype="multipart/form-data" id="formNaoConformidade">
                <input type="hidden" name="id_execucao" id="id_execucao">

                <!-- Câmera (abre a câmera no celular) e anexo de imagem -->
                <div class="d-flex justify-content-end gap-3 mb-2 pe-1">
                    <label for="capturaCamera" class="btn btn-outline-primary btn-sm" title="Tirar Foto">
                        <i class="bi bi-camera-fill fs-5"></i>
                        <input type="file" id="capturaCamera" name="foto_evidencia" accept="image/*" capture="environment" class="d-none" onchange="mostrarNomeArquivo(this, 'statusCamera')">
                    </label>
                    <label for="anexoArquivo" class="btn btn-outline-secondary btn-sm" title="Anexar Imagem">
                        <i class="bi bi-image fs-5"></i>
                        <input type="file" id="anexoArquivo" name="documento_evidencia" accept="image/*" class="d-none" onchange="mostrarNomeArquivo(this, 'statusArquivo')">
                    </label>
                </div>
                <div class="mb-2">
                    <span id="statusCamera" class="badge bg-success d-none mb-1"><i class="bi bi-check-lg me-1"></i> Foto capturada</span>
                    <span id="statusArquivo" class="badge bg-info text-dark d-none mb-1"><i class="bi bi-paperclip me-1"></i> Imagem anexada</span>
                </div>

                <div class="mb-4">
                    <label for="descricao_detalhada" class="form-label fw-semibold">Descrição da não conformidade</label>
                    <textarea name="descricao_detalhada" id="descricao_detalhada" class="form-control" rows="8" maxlength="5000" required
                        placeholder="Descreva detalhadamente a avaria ou o problema encontrado..."></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a href="oqfazer.php?aba=checklists" class="btn btn-link text-decoration-none text-dark fw-bold ps-0">
                        <i class="bi bi-chevron-left me-1"></i> Voltar ao painel
                    </a>
                    <button type="submit" class="btn btn-primary fw-bold">
                        Salvar e ir para assinaturas <i class="bi bi-chevron-right ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const toast = new bootstrap.Toast(document.getElementById('toastNaoConformidade'), { delay: 5000 });
            toast.show();

            const id = new URLSearchParams(window.location.search).get('id');
            document.getElementById('id_execucao').value = id || '';
            const resp = await fetch(`backend/api.php?acao=obter_vistoria&id=${encodeURIComponent(id)}`, { headers: { Accept: 'application/json' } });
            const json = await resp.json();
            if (!json.sucesso) {
                document.getElementById('resumo-vistoria').textContent = json.erro || 'Vistoria não encontrada.';
                document.querySelector('#formNaoConformidade button[type=submit]').disabled = true;
                return;
            }
            const v = json.dados;
            if (v.assinado_em) { window.location.href = `verVistoria.html?id=${v.id_execucao}`; return; }
            document.getElementById('resumo-vistoria').textContent =
                `Vistoria #${v.id_execucao} - ${v.placa_veiculo} - ${v.checklist_titulo}`;
            if (v.detalhes_nao_conformidade) document.getElementById('descricao_detalhada').value = v.detalhes_nao_conformidade;
            const fora = (v.respostas || []).filter(r => r.conforme !== null && Number(r.conforme) === 0);
            if (fora.length) {
                document.getElementById('itens-fora-padrao').innerHTML =
                    '<div class="alert alert-warning small mb-0"><strong>Itens fora do padrão:</strong><ul class="mb-0">' +
                    fora.map(r => `<li>${axionEsc(r.pergunta_texto)} (resposta: ${axionEsc(r.resposta)})</li>`).join('') + '</ul></div>';
            }
        });

        function mostrarNomeArquivo(input, idBadge) {
            if (input.files && input.files[0]) document.getElementById(idBadge).classList.remove('d-none');
        }
    </script>
</body>

</html>
