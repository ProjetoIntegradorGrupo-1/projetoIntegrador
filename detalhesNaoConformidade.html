<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Adicionais do Veículo - Axion</title>
    <!-- CSS do Bootstrap e Ícones FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

    <!-- TOAST DE RECOMENDAÇÃO (Disparado quando houver não conformidade) -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div id="toastNaoConformidade" class="toast align-items-center text-white bg-warning border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body text-dark">
                    <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
                    <strong>Atenção:</strong> Resposta fora do padrão esperado. Favor registrar fotos e a descrição do problema.
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 600px; width: 100%;">
            
            <h1 class="h4 text-center mb-3">Informações adicionais das condições do veículo</h1>

            <!-- Barra de Ações de Mídia (Câmera e Anexo de Arquivo) -->
            <div class="d-flex justify-content-end gap-3 mb-2 pe-1">
                <!-- Botão Câmera (Abre a câmera nativa no celular) -->
                <label for="capturaCamera" class="btn btn-outline-primary btn-sm position-relative" title="Tirar Foto">
                    <i class="bi bi-camera-fill fs-5"></i>
                    <input type="file" id="capturaCamera" name="foto_evidencia" accept="image/*" capture="environment" class="d-none" onchange="mostrarNomeArquivo(this, 'statusCamera')">
                </label>

                <!-- Botão Anexo de Arquivo/Documento -->
                <label for="anexoArquivo" class="btn btn-outline-secondary btn-sm position-relative" title="Anexar Arquivo">
                    <i class="bi bi-file-earmark-text-fill fs-5"></i>
                    <input type="file" id="anexoArquivo" name="documento_evidencia" accept="image/*,application/pdf" class="d-none" onchange="mostrarNomeArquivo(this, 'statusArquivo')">
                </label>
            </div>

            <!-- Indicadores Visuais de Arquivos Anexados -->
            <div class="mb-2">
                <span id="statusCamera" class="badge bg-success d-none mb-1"><i class="bi bi-check-lg me-1"></i> Foto capturada</span>
                <span id="statusArquivo" class="badge bg-info text-dark d-none mb-1"><i class="bi bi-paperclip me-1"></i> Arquivo anexado</span>
            </div>

            <!-- Formulário com Caixa de Texto Ampla -->
            <form action="processar_detalhes_checklist.php" method="post" enctype="multipart/form-data">
                
                <div class="mb-4">
                    <textarea name="descricao_detalhada" id="descricao_detalhada" class="form-control" rows="8" placeholder="Descreva detalhadamente a situação de não conformidade ou observações do veículo..." required></textarea>
                </div>

                <!-- Navegação no estilo "Página Anterior" e "Próxima Página" -->
                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a href="preencherChecklist.html" class="btn btn-link text-decoration-none text-dark fw-bold ps-0">
                        <i class="bi bi-chevron-left me-1"></i> Página Anterior
                    </a>

                    <button type="submit" class="btn btn-link text-decoration-none text-dark fw-bold pe-0">
                        Próxima Página <i class="bi bi-chevron-right ms-1"></i>
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- JS do Bootstrap e Script de Interatividade -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Exibe o Toast automaticamente ao carregar a página (Simulação de redirecionamento por Não Conformidade)
        document.addEventListener("DOMContentLoaded", function () {
            const toastEl = document.getElementById('toastNaoConformidade');
            const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
            toast.show();
        });

        // Função para mostrar feedback visual quando o motorista tira foto ou anexa arquivo
        function mostrarNomeArquivo(input, idBadge) {
            const badge = document.getElementById(idBadge);
            if (input.files && input.files[0]) {
                badge.classList.remove('d-none');
            }
        }
    </script>
</body>

</html>
