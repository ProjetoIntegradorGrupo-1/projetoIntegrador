<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Veículo - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
</head>

<body>

    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Excluir Veículo</span>
            </a>
            <a href="oqfazer.php?aba=veiculos" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i>Voltar aos Carros</a>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card border-danger" style="max-width: 680px;">
            <h1 class="h4 text-danger fw-bold mb-1"><i class="bi bi-trash3-fill me-2"></i>Excluir Veículo da Frota</h1>
            <p class="text-muted small mb-4">Selecione o veículo cadastrado para revisar seus dados e confirmar a remoção.</p>

            <div class="mb-4">
                <label for="select-veiculo" class="form-label fw-bold">Selecione o Veículo</label>
                <select id="select-veiculo" class="form-select" onchange="carregarResumoVeiculo(this.value)">
                    <option value="">Carregando veículos...</option>
                </select>
            </div>

            <form action="backend/api.php?acao=excluir_veiculo" method="post">
                <input type="hidden" name="id_veiculo" id="id_veiculo" value="">

                <div class="card bg-danger-subtle border-danger p-3 mb-4">
                    <h2 class="h6 text-danger fw-bold mb-2">Dados do Veículo Selecionado:</h2>
                    <ul class="mb-0 small text-dark ps-3" id="resumo-veiculo">
                        <li>Carregando dados...</li>
                    </ul>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirmarExclusaoVeiculo" required>
                    <label class="form-check-label small fw-semibold text-danger" for="confirmarExclusaoVeiculo">
                        Confirmar a exclusão permanente deste veículo do sistema.
                    </label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="oqfazer.php?aba=veiculos" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-danger fw-semibold"><i class="bi bi-trash3 me-1"></i>Excluir Veículo</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function inicializarExclusaoVeiculo() {
            const resp = await fetch('backend/api.php?acao=buscar&tipo=veiculos&limite=0');
            const json = await resp.json();
            const sel = document.getElementById('select-veiculo');
            if (!json.dados || json.dados.length === 0) return;
            sel.innerHTML = json.dados.map(v =>
                `<option value="${v.id_veiculo}">${v.placa} | ${v.marca_modelo} (${v.ano})</option>`
            ).join('');
            const urlId = new URLSearchParams(window.location.search).get('id') || json.dados[0].id_veiculo;
            sel.value = urlId;
            carregarResumoVeiculo(urlId);
        }

        async function carregarResumoVeiculo(id) {
            const resp = await fetch(`backend/api.php?acao=obter_veiculo&id=${id}`);
            const json = await resp.json();
            if (!json.dados) return;
            const v = json.dados;
            document.getElementById('id_veiculo').value = v.id_veiculo;
            document.getElementById('resumo-veiculo').innerHTML = `
                <li><strong>Placa:</strong> ${v.placa}</li>
                <li><strong>Modelo/Marca:</strong> ${v.marca_modelo} (${v.cor || '-'})</li>
                <li><strong>Ano / Km:</strong> ${v.ano} | ${Number(v.km_rodado || 0).toLocaleString('pt-BR')} km</li>
                <li><strong>Renavam / Chassi:</strong> ${v.renavam || '-'} / ${v.chassi || '-'}</li>
            `;
        }
        document.addEventListener('DOMContentLoaded', inicializarExclusaoVeiculo);
    </script>
</body>

</html>
