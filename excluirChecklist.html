<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Checklist - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
</head>

<body>

    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Excluir Checklist</span>
            </a>
            <a href="oqfazer.php?aba=checklists" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i>Voltar aos Checklists</a>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card border-danger" style="max-width: 680px;">
            <h1 class="h4 text-danger fw-bold mb-1"><i class="bi bi-trash3-fill me-2"></i>Excluir Modelo de Checklist</h1>
            <p class="text-muted small mb-4">Remova o formulário de vistoria e suas perguntas vinculadas.</p>

            <div class="mb-4">
                <label for="select-checklist" class="form-label fw-bold">Selecione o Modelo de Checklist</label>
                <select id="select-checklist" class="form-select" onchange="carregarResumoChecklist(this.value)">
                    <option value="">Carregando modelos...</option>
                </select>
            </div>

            <form action="backend/api.php?acao=excluir_checklist" method="post">
                <input type="hidden" name="id_checklist" id="id_checklist" value="">

                <div class="card bg-danger-subtle border-danger p-3 mb-4">
                    <h2 class="h6 text-danger fw-bold mb-2">Resumo do Checklist:</h2>
                    <ul class="mb-0 small text-dark ps-3" id="resumo-checklist">
                        <li>Carregando dados...</li>
                    </ul>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirmarExclusaoChecklist" required>
                    <label class="form-check-label small fw-semibold text-danger" for="confirmarExclusaoChecklist">
                        Confirmar a exclusão deste modelo de checklist. Os motoristas não poderão mais preenchê-lo.
                    </label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="oqfazer.php?aba=checklists" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-danger fw-semibold"><i class="bi bi-trash3 me-1"></i>Excluir Checklist</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function inicializarExclusaoChecklist() {
            const resp = await fetch('backend/api.php?acao=buscar&tipo=checklists');
            const json = await resp.json();
            const sel = document.getElementById('select-checklist');
            if (!json.dados || json.dados.length === 0) return;
            sel.innerHTML = json.dados.map(c =>
                `<option value="${c.id_checklist}">#${c.id_checklist} - ${c.titulo} (${c.categoria.toUpperCase()})</option>`
            ).join('');
            const urlId = new URLSearchParams(window.location.search).get('id') || json.dados[0].id_checklist;
            sel.value = urlId;
            carregarResumoChecklist(urlId);
        }

        async function carregarResumoChecklist(id) {
            const resp = await fetch(`backend/api.php?acao=obter_checklist&id=${id}`);
            const json = await resp.json();
            if (!json.dados) return;
            const c = json.dados;
            document.getElementById('id_checklist').value = c.id_checklist;
            document.getElementById('resumo-checklist').innerHTML = `
                <li><strong>ID:</strong> #${c.id_checklist}</li>
                <li><strong>Título:</strong> ${c.titulo}</li>
                <li><strong>Categoria:</strong> ${c.categoria.toUpperCase()}</li>
                <li><strong>Total de Perguntas:</strong> ${(c.perguntas || []).length} perguntas cadastradas</li>
            `;
        }
        document.addEventListener('DOMContentLoaded', inicializarExclusaoChecklist);
    </script>
</body>

</html>
