<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Usuário - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
</head>

<body>

    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Excluir Usuário</span>
            </a>
            <a href="oqfazer.php?aba=usuarios" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i>Voltar aos Usuários</a>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card border-danger" style="max-width: 680px;">
            <h1 class="h4 text-danger fw-bold mb-1"><i class="bi bi-person-x-fill me-2"></i>Excluir Usuário</h1>
            <p class="text-muted small mb-4">Selecione o usuário cadastrado no banco para revisar e confirmar a remoção.</p>

            <div class="mb-4">
                <label for="select-usuario" class="form-label fw-bold">Selecione o Usuário</label>
                <select id="select-usuario" class="form-select" onchange="carregarResumoUsuario(this.value)">
                    <option value="">Carregando usuários...</option>
                </select>
            </div>

            <form action="backend/api.php?acao=excluir_usuario" method="post">
                <input type="hidden" name="id_usuario" id="id_usuario" value="">

                <div class="card bg-danger-subtle border-danger p-3 mb-4">
                    <h2 class="h6 text-danger fw-bold mb-2">Dados do Usuário Selecionado:</h2>
                    <ul class="mb-0 small text-dark ps-3" id="resumo-usuario">
                        <li>Carregando informações...</li>
                    </ul>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirmarExclusao" required>
                    <label class="form-check-label small fw-semibold text-danger" for="confirmarExclusao">
                        Estou ciente de que esta ação removerá o acesso deste usuário ao sistema.
                    </label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="oqfazer.php?aba=usuarios" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-danger fw-semibold"><i class="bi bi-trash3 me-1"></i>Confirmar Exclusão</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function inicializarExclusaoUsuario() {
            const resp = await fetch('backend/api.php?acao=buscar&tipo=usuarios&limite=0');
            const json = await resp.json();
            const sel = document.getElementById('select-usuario');
            if (!json.dados || json.dados.length === 0) return;
            sel.innerHTML = json.dados.map(u =>
                `<option value="${u.id_usuario}">#${u.id_usuario} - ${u.nome} (${u.cpf_matricula}) - ${u.perfil.toUpperCase()}</option>`
            ).join('');
            const urlId = new URLSearchParams(window.location.search).get('id') || json.dados[0].id_usuario;
            sel.value = urlId;
            carregarResumoUsuario(urlId);
        }

        async function carregarResumoUsuario(id) {
            const resp = await fetch(`backend/api.php?acao=obter_usuario&id=${id}`);
            const json = await resp.json();
            if (!json.dados) return;
            const u = json.dados;
            document.getElementById('id_usuario').value = u.id_usuario;
            document.getElementById('resumo-usuario').innerHTML = `
                <li><strong>ID:</strong> #${u.id_usuario}</li>
                <li><strong>Nome:</strong> ${u.nome}</li>
                <li><strong>CPF:</strong> ${u.cpf_matricula}</li>
                <li><strong>Perfil:</strong> ${u.perfil.toUpperCase()}</li>
                <li><strong>CNH / Categoria:</strong> ${u.cnh || '-'} (${u.categoria_cnh || '-'})</li>
                <li><strong>E-mail:</strong> ${u.email}</li>
            `;
        }
        document.addEventListener('DOMContentLoaded', inicializarExclusaoUsuario);
    </script>
</body>

</html>
