<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura dos Usuários - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        canvas { touch-action: none; }
        .canvas-container {
            position: relative;
            touch-action: none; /* Impede a tela do celular de rolar enquanto assina */
        }
        canvas {
            border: 2px dashed #6c757d;
            border-radius: 6px;
            cursor: crosshair;
            background-color: #ffffff;
            width: 100%;
            height: 160px;
        }
    </style>
    <link rel="stylesheet" href="frontend/css/axion-web.css">
    <link rel="icon" type="image/png" href="frontend/img/favicon.png">
</head>

<body class="bg-light" data-secao="vistorias" data-titulo="Assinatura">
    <main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 640px; width: 100%;">
            <h1 class="h4 text-center mb-1" id="titulo">Assinatura da vistoria</h1>
            <p class="text-center text-muted small mb-3" id="resumo-vistoria">Carregando vistoria...</p>

            <div id="alertaErro" class="alert alert-danger d-none mb-3" role="alert"></div>
            <div id="box-status" class="mb-3"></div>

            <form id="formAssinatura" class="d-none" onsubmit="return false;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label fw-bold mb-0" id="label-assinatura">Sua assinatura</label>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="limparCanvas()">Limpar</button>
                </div>
                <div class="canvas-container"><canvas id="canvasAssinatura"></canvas></div>
                <div class="form-text mb-3" id="texto-ajuda"></div>

                <div class="form-check mb-3 d-none" id="box-manutencao">
                    <input class="form-check-input" type="checkbox" id="enviar_manutencao" checked>
                    <label class="form-check-label" for="enviar_manutencao">Enviar o veículo para manutenção ao aprovar (vistoria com avaria)</label>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-primary btn-lg" id="btn-assinar" onclick="assinar()">Assinar</button>
                    <a class="btn btn-outline-secondary" id="link-revisar" href="#">Revisar a vistoria completa</a>
                    <a class="btn btn-outline-warning d-none" id="link-corrigir" href="#"><i class="bi bi-pencil-square me-1"></i>Errei alguma resposta: corrigir</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        const idExecucao = new URLSearchParams(window.location.search).get('id');
        let csrf = '';
        let papel = null;

        function configurarCanvas() {
            const canvas = document.getElementById('canvasAssinatura');
            const ctx = canvas.getContext('2d');
            let desenhando = false;
            canvas.width = canvas.getBoundingClientRect().width;
            canvas.height = 160;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';
            canvas.dataset.tracos = '0';
            function pos(e) {
                const r = canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
            }
            const iniciar = (e) => { e.preventDefault(); desenhando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
            const desenhar = (e) => {
                if (!desenhando) return;
                e.preventDefault();
                const p = pos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                canvas.dataset.tracos = String(Number(canvas.dataset.tracos) + 1);
            };
            const parar = () => { desenhando = false; };
            canvas.addEventListener('mousedown', iniciar);
            canvas.addEventListener('mousemove', desenhar);
            canvas.addEventListener('mouseup', parar);
            canvas.addEventListener('mouseleave', parar);
            canvas.addEventListener('touchstart', iniciar, { passive: false });
            canvas.addEventListener('touchmove', desenhar, { passive: false });
            canvas.addEventListener('touchend', parar);
        }

        function limparCanvas() {
            const canvas = document.getElementById('canvasAssinatura');
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            canvas.dataset.tracos = '0';
        }

        function mostrarErro(msg) {
            const el = document.getElementById('alertaErro');
            el.textContent = msg;
            el.classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function assinar() {
            document.getElementById('alertaErro').classList.add('d-none');
            const canvas = document.getElementById('canvasAssinatura');
            if (Number(canvas.dataset.tracos) < 15) { mostrarErro('Desenhe a sua assinatura no quadro.'); return; }
            const fd = new FormData();
            fd.append('id_execucao', idExecucao);
            fd.append('csrf', csrf);
            fd.append('assinatura', canvas.toDataURL('image/png'));
            if (document.getElementById('enviar_manutencao').checked && !document.getElementById('box-manutencao').classList.contains('d-none')) {
                fd.append('enviar_manutencao', '1');
            }
            const btn = document.getElementById('btn-assinar');
            btn.disabled = true;
            try {
                const resp = await fetch('backend/api.php?acao=assinar_vistoria', { method: 'POST', body: fd, headers: { Accept: 'application/json' } });
                const json = await resp.json();
                if (!json.sucesso) {
                    if (json.redirecionar) { window.location.href = json.redirecionar; return; }
                    mostrarErro(json.erro || 'Não foi possível registrar a assinatura.');
                    btn.disabled = false;
                    return;
                }
                window.location.href = json.redirecionar;
            } catch (e) {
                mostrarErro('Falha de comunicação com o servidor.');
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            const ctx = await AxionSessao.pronta;
            if (!ctx) return;
            csrf = ctx.csrf;
            const resp = await fetch(`backend/api.php?acao=obter_vistoria&id=${encodeURIComponent(idExecucao)}`, { headers: { Accept: 'application/json' } });
            const json = await resp.json();
            if (!json.sucesso) { mostrarErro(json.erro || 'Vistoria não encontrada.'); return; }
            const v = json.dados;
            document.getElementById('resumo-vistoria').textContent = `Vistoria #${v.id_execucao} - ${v.placa_veiculo} - ${v.checklist_titulo}`;
            document.getElementById('link-revisar').href = `verVistoria.html?id=${v.id_execucao}`;
            // Enquanto ninguém assinou, quem registrou pode corrigir as respostas
            if (v.pode_corrigir) {
                const c = document.getElementById('link-corrigir');
                c.href = `cadcheck.html?editar=${v.id_execucao}`;
                c.classList.remove('d-none');
            }
            if (new URLSearchParams(location.search).get('corrigida')) {
                document.getElementById('formAssinatura').insertAdjacentHTML('afterbegin', '<div class="alert alert-success py-2 small"><i class="bi bi-check-circle me-1"></i>Respostas corrigidas. Confira e assine.</div>');
            }
            if (!v.pode_assinar) { window.location.href = `verVistoria.html?id=${v.id_execucao}`; return; }
            if (v.status_conformidade === 'nao_conforme' && !v.detalhes_nao_conformidade && v.pode_editar_avaria) {
                window.location.href = `detalhesNaoConformidade.html?id=${v.id_execucao}`;
                return;
            }
            papel = v.meu_papel;
            const outro = papel === 'motorista' ? v.nome_vistoriador : v.nome_motorista;
            const outroAssinou = papel === 'motorista' ? v.assinado_vistoriador_em : v.assinado_motorista_em;
            const rotMot = v.id_locacao ? 'cliente' : 'motorista';
            const rotVist = v.id_locacao ? 'testemunha' : 'vistoriador';
            document.getElementById('titulo').textContent = papel === 'motorista' ? `Assinatura do ${rotMot}` : (v.id_locacao ? 'Assinatura da testemunha' : 'Aprovação do vistoriador');
            document.getElementById('label-assinatura').textContent = `Sua assinatura (${papel === 'motorista' ? rotMot : rotVist}: ${ctx.usuario.nome})`;
            document.getElementById('texto-ajuda').textContent = outroAssinou
                ? `${outro} já assinou. Sua assinatura conclui a vistoria.`
                : `Ao assinar, a vistoria será enviada para ${outro} ${papel === 'motorista' ? 'revisar e aprovar' : 'conferir e assinar'}.`;
            const resultado = v.status_conformidade === 'nao_conforme'
                ? '<span class="badge bg-danger">Não Conforme</span>' : '<span class="badge bg-success">Conforme</span>';
            document.getElementById('box-status').innerHTML = `<div class="p-2 bg-light border rounded small">Resultado: ${resultado}
                · ${v.id_locacao ? 'Cliente' : 'Motorista'}: <strong>${axionEsc(v.nome_motorista)}</strong> · ${v.id_locacao ? 'Testemunha' : 'Vistoriador'}: <strong>${axionEsc(v.nome_vistoriador)}</strong></div>`;
            // Na retirada da locação a avaria só fica registrada (o carro segue com o cliente);
            // na devolução, o carro vai para a manutenção quando a devolução for registrada
            if (papel === 'vistoriador' && v.status_conformidade === 'nao_conforme' && v.tipo_locacao !== 'retirada') {
                document.getElementById('box-manutencao').classList.remove('d-none');
                if (v.tipo_locacao === 'devolucao') document.querySelector('label[for="enviar_manutencao"]').textContent = 'Mandar o veículo para manutenção quando a devolução for registrada';
            }
            document.getElementById('btn-assinar').textContent = (papel === 'vistoriador' && v.assinado_motorista_em) ? 'Aprovar e assinar' : 'Assinar';
            document.getElementById('formAssinatura').classList.remove('d-none');
            configurarCanvas();
        });
    </script>
</body>

</html>
