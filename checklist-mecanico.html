<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Mecânico do Veículo</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 550px; width: 100%;">
            <h1 class="h4 text-center mb-4">Checklist Mecânico do Veículo</h1>

            <form action="processar_checklist_mecanico.php" method="post">
                
                <!-- Item 1 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">1. A temperatura do motor está dentro do limite seguro?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="temp-sim" name="motor" value="sim" required>
                            <label class="form-check-label" for="temp-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="temp-nao" name="motor" value="nao" required>
                            <label class="form-check-label" for="temp-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">2. O nível do óleo do motor está adequado?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelOleoMotor-sim" name="nivelOleoMotor" value="sim" required>
                            <label class="form-check-label" for="nivelOleoMotor-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelOleoMotor-nao" name="nivelOleoMotor" value="nao" required>
                            <label class="form-check-label" for="nivelOleoMotor-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">3. O óleo do motor está escuro?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="corOleoMotor-sim" name="corOleoMotor" value="sim" required>
                            <label class="form-check-label" for="corOleoMotor-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="corOleoMotor-nao" name="corOleoMotor" value="nao" required>
                            <label class="form-check-label" for="corOleoMotor-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 4 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">4. O nível do fluido do freio está adequado?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoFreio-sim" name="nivelFluidoFreio" value="sim" required>
                            <label class="form-check-label" for="nivelFluidoFreio-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoFreio-nao" name="nivelFluidoFreio" value="nao" required>
                            <label class="form-check-label" for="nivelFluidoFreio-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 5 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">5. O nível do fluido da direção está adequado?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoDirecao-sim" name="nivelFluidoDirecao" value="sim" required>
                            <label class="form-check-label" for="nivelFluidoDirecao-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoDirecao-nao" name="nivelFluidoDirecao" value="nao" required>
                            <label class="form-check-label" for="nivelFluidoDirecao-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 6 -->
                <div class="mb-3 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">6. O nível do fluido do radiador está adequado?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoRadiador-sim" name="nivelFluidoRadiador" value="sim" required>
                            <label class="form-check-label" for="nivelFluidoRadiador-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="nivelFluidoRadiador-nao" name="nivelFluidoRadiador" value="nao" required>
                            <label class="form-check-label" for="nivelFluidoRadiador-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Item 7 -->
                <div class="mb-4 p-3 border rounded bg-white">
                    <label class="form-label fw-semibold">7. As pastilhas de freio estão em bom estado?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="pastilhasFreio-sim" name="pastilhasFreio" value="sim" required>
                            <label class="form-check-label" for="pastilhasFreio-sim">Sim</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" id="pastilhasFreio-nao" name="pastilhasFreio" value="nao" required>
                            <label class="form-check-label" for="pastilhasFreio-nao">Não</label>
                        </div>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2">
                    <input type="submit" value="Enviar Checklist" class="btn btn-primary">
                    <a href="oqfazer.html" class="btn btn-outline-secondary">Voltar ao Menu</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
