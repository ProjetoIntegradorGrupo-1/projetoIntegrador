    <link rel="stylesheet" href="frontend/css/axion-web.css">
</head>

<body>

    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Editar Usuário</span>
            </a>
            <div class="d-flex gap-2">
                <a href="oqfazer.php?aba=usuarios" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-search me-1"></i>Buscar Usuários</a>
                <a href="oqfazer.php" class="btn btn-sm btn-outline-light"><i class="bi bi-grid-1x2 me-1"></i>Painel Principal</a>
            </div>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card">
            <h1 class="h4 fw-bold mb-3"><i class="bi bi-person-gear text-primary me-2"></i>Editar Usuário</h1>

            <!-- 1. BLOCO DE BUSCA E SELEÇÃO DO USUÁRIO DO BANCO -->
            <div class="mb-4 p-3 bg-light border rounded">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label for="filtro-rapido-usuario" class="form-label small fw-bold mb-1">Filtrar por Nome ou CPF</label>
                        <input type="text" id="filtro-rapido-usuario" class="form-control" placeholder="Digite para filtrar a lista..." oninput="carregarListaUsuarios(this.value)">
                    </div>
                    <div class="col-md-7">
                        <label for="select-usuario" class="form-label small fw-bold mb-1">Selecione o Usuário Cadastrado</label>
                        <div class="input-group">
                            <select id="select-usuario" class="form-select" onchange="carregarUsuarioPorId(this.value)">
                                <option value="">Carregando usuários do banco...</option>
                            </select>
                            <button class="btn btn-primary" type="button" onclick="carregarUsuarioPorId(document.getElementById('select-usuario').value)">
                                <i class="bi bi-arrow-down-circle me-1"></i>Carregar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. FORMULÁRIO DE EDIÇÃO -->
            <form action="backend/api.php?acao=salvar_edicao_usuario" method="post" id="formEditarUsuario">
                <input type="hidden" name="id_usuario" id="id_usuario" value="1">

                <div class="axion-section-title"><i class="bi bi-person-vcard"></i> 1. Dados Pessoais e Nível de Acesso</div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="sobrenome" class="form-label fw-semibold">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cpf" class="form-label fw-semibold">CPF (Com Validação)</label>
                        <input type="text" id="cpf" name="cpf" data-mask="cpf" class="form-control font-monospace" maxlength="14" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="dtNascimento" class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" name="dtNascimento" id="dtNascimento" class="form-control">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="genero" class="form-label fw-semibold">Gênero</label>
                        <select name="genero" id="genero" class="form-select">
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="perfil" class="form-label fw-semibold">Perfil / Nível de Acesso</label>
                        <select name="perfil" id="perfil" class="form-select" required>
                            <option value="admin">Admin (Privilégio Total)</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="motorista">Motorista</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="telefone" class="form-label fw-semibold">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" data-mask="telefone" class="form-control" maxlength="15" required>
                    </div>
                </div>

                <div class="axion-section-title mt-2"><i class="bi bi-card-heading"></i> 2. CNH e Contato</div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="cnh" class="form-label fw-semibold">N° da CNH</label>
                        <input type="text" name="cnh" id="cnh" data-mask="cnh" class="form-control font-monospace" maxlength="11">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="categoria-cnh" class="form-label fw-semibold">Categoria CNH (Dropdown)</label>
                        <select id="categoria-cnh" name="categoria-cnh" class="form-select">
                            <option value="A">Categoria A</option>
                            <option value="B">Categoria B</option>
                            <option value="C">Categoria C</option>
                            <option value="D">Categoria D</option>
                            <option value="E">Categoria E</option>
                            <option value="AB">Categoria AB</option>
                            <option value="AC">Categoria AC</option>
                            <option value="AD">Categoria AD</option>
                            <option value="AE">Categoria AE</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="validade-cnh" class="form-label fw-semibold">Validade CNH</label>
                        <input type="date" name="validade-cnh" id="validade-cnh" class="form-control">
                    </div>
                </div>

                <div class="axion-section-title mt-2"><i class="bi bi-geo-alt-fill"></i> 3. Endereço (Busca por CEP Gratuita) e E-mail</div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="cep" class="form-label fw-semibold">CEP</label>
                        <div class="input-group">
                            <input type="text" id="cep" name="cep" data-mask="cep" class="form-control font-monospace" maxlength="9">
                            <button class="btn btn-outline-primary" type="button" id="btn-buscar-cep"><i class="bi bi-search"></i></button>
                        </div>
                        <div id="cep-feedback" class="form-text small"></div>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="logradouro" class="form-label fw-semibold">Logradouro</label>
                        <input type="text" id="logradouro" name="logradouro" class="form-control">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="numero" class="form-label fw-semibold">Número</label>
                        <input type="text" id="numero" name="numero" class="form-control">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="estado" class="form-label fw-semibold">UF</label>
                        <input type="text" id="estado" name="estado" class="form-control text-uppercase" maxlength="2">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="bairro" class="form-label fw-semibold">Bairro</label>
                        <input type="text" id="bairro" name="bairro" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cidade" class="form-label fw-semibold">Cidade</label>
                        <input type="text" id="cidade" name="cidade" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="email" class="form-label fw-semibold">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-end mt-3">
                    <a href="oqfazer.php?aba=usuarios" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-check2-circle me-1"></i>Salvar Alterações</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        async function carregarListaUsuarios(termo = '') {
            const resp = await fetch(`backend/api.php?acao=buscar&tipo=usuarios&q=${encodeURIComponent(termo)}&limite=150`);
            const json = await resp.json();
            const sel = document.getElementById('select-usuario');
            if (!json.dados || json.dados.length === 0) {
                sel.innerHTML = '<option value="">Nenhum usuário encontrado</option>';
                return;
            }
            sel.innerHTML = json.dados.map(u =>
                `<option value="${u.id_usuario}">#${u.id_usuario} - ${u.nome} (CPF: ${u.cpf_matricula}) [${u.perfil.toUpperCase()}]</option>`
            ).join('');

            const urlId = new URLSearchParams(window.location.search).get('id');
            if (urlId && !termo) {
                sel.value = urlId;
                carregarUsuarioPorId(urlId);
            } else if (json.dados[0]) {
                carregarUsuarioPorId(json.dados[0].id_usuario);
            }
        }

        async function carregarUsuarioPorId(id) {
            if (!id) return;
            const resp = await fetch(`backend/api.php?acao=obter_usuario&id=${id}`);
            const json = await resp.json();
            if (!json.sucesso || !json.dados) return;
            const u = json.dados;
            document.getElementById('id_usuario').value = u.id_usuario;
            document.getElementById('nome').value = u.nome || '';
            document.getElementById('sobrenome').value = u.sobrenome || '';
            document.getElementById('cpf').value = u.cpf_matricula || '';
            document.getElementById('dtNascimento').value = u.data_nascimento || '';
            document.getElementById('genero').value = u.genero || 'Masculino';
            document.getElementById('perfil').value = u.perfil || 'motorista';
            document.getElementById('telefone').value = u.telefone || '';
            document.getElementById('cnh').value = u.cnh || '';
            document.getElementById('categoria-cnh').value = u.categoria_cnh || 'B';
            document.getElementById('validade-cnh').value = u.validade_cnh || '';
            document.getElementById('cep').value = u.cep || '';
            document.getElementById('logradouro').value = u.logradouro || '';
            document.getElementById('numero').value = u.numero || '';
            document.getElementById('bairro').value = u.bairro || '';
            document.getElementById('cidade').value = u.cidade || '';
            document.getElementById('estado').value = u.estado || '';
            document.getElementById('email').value = u.email || '';
            AxionUtils.inicializarMascarasEValidacoes();
        }

        document.addEventListener('DOMContentLoaded', () => carregarListaUsuarios());
    </script>
</body>

</html>
