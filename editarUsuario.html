            <!-- 1. BLOCO DE BUSCA E SELEÇÃO DO USUÁRIO DO BANCO -->
            <div class="mb-4 p-3 bg-light border rounded">
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label for="filtro-rapido-usuario" class="form-label small fw-bold mb-1">Filtrar por Nome, CPF ou E-mail</label>
                        <input type="text" id="filtro-rapido-usuario" class="form-control" placeholder="Ex: Maria, 123.456 ou 12345678909" oninput="filtrarComAtraso(this.value)">
                    </div>
                    <div class="col-md-7">
                        <label for="select-usuario" class="form-label small fw-bold mb-1">Selecione o Usuário Cadastrado</label>
                        <div class="input-group">

                                <option value="">Carregando usuários do banco...</option>

                                <i class="bi bi-arrow-down-circle me-1"></i>Carregar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. FORMULÁRIO DE EDIÇÃO -->
            <form action="backend/api.php?acao=salvar_edicao_usuario" method="post" id="formEditarUsuario">
                <input type="hidden" name="id_usuario" id="id_usuario" value="">

                <div class="mb-4" id="campo-foto"></div>

                <div class="axion-section-title"><i class="bi bi-person-vcard"></i> Dados pessoais e perfil</div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="sobrenome" class="form-label fw-semibold">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cpf" class="form-label fw-semibold">CPF</label>
                        <input type="text" id="cpf" name="cpf" data-mask="cpf" class="form-control font-monospace" maxlength="14" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="dtNascimento" class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" name="dtNascimento" id="dtNascimento" class="form-control">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="genero" class="form-label fw-semibold">Gênero</label>
                        <select name="genero" id="genero" class="form-select">
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="perfil" class="form-label fw-semibold">Perfil / Nível de Acesso</label>
                        <select name="perfil" id="perfil" class="form-select" required>
                            <option value="" selected disabled>Carregue um usuário</option>
                            <option value="admin">Admin (Privilégio Total)</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="motorista">Motorista</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="telefone" class="form-label fw-semibold">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" data-mask="telefone" class="form-control" maxlength="15" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="status" class="form-label fw-semibold">Situação da conta</label>
                        <select id="status" name="status" class="form-select">
                            <option value="ativo">Ativa (pode entrar)</option>
                            <option value="inativo">Desativada (não entra)</option>
                        </select>
                    </div>
                </div>
                <div class="row" id="linha-supervisor" style="display:none">
                    <div class="col-md-6 mb-3">
                        <label for="id_supervisor" class="form-label fw-semibold">Supervisor responsável pelo motorista</label>
                        <select id="id_supervisor" name="id_supervisor" class="form-select">
                            <option value="">Sem supervisor definido</option>
                        </select>
                        <div class="form-text">É este supervisor que assina as vistorias feitas por este motorista.</div>
                    </div>
                </div>

                <div class="axion-section-title mt-2"><i class="bi bi-card-heading"></i> Habilitação</div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="cnh" class="form-label fw-semibold">N° da CNH</label>
                        <input type="text" name="cnh" id="cnh" data-mask="cnh" class="form-control font-monospace" maxlength="11">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="categoria-cnh" class="form-label fw-semibold">Categoria da CNH</label>
                        <select id="categoria-cnh" name="categoria-cnh" class="form-select">
                            <option value="A">Categoria A</option>
                            <option value="B">Categoria B</option>
                            <option value="C">Categoria C</option>
                            <option value="D">Categoria D</option>
                            <option value="E">Categoria E</option>
                            <option value="AB">Categoria AB</option>
                            <option value="AC">Categoria AC</option>
                            <option value="AD">Categoria AD</option>
                            <option value="AE">Categoria AE</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="validade-cnh" class="form-label fw-semibold">Validade CNH</label>
                        <input type="date" name="validade-cnh" id="validade-cnh" class="form-control">
                    </div>
                </div>

                <div class="axion-section-title mt-2"><i class="bi bi-geo-alt-fill"></i> Endereço e e-mail</div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="cep" class="form-label fw-semibold">CEP</label>
                        <div class="input-group">
                            <input type="text" id="cep" name="cep" data-mask="cep" class="form-control font-monospace" maxlength="9">
                            <button class="btn btn-outline-primary" type="button" id="btn-buscar-cep"><i class="bi bi-search"></i></button>
                        </div>
                        <div id="cep-feedback" class="form-text small"></div>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="logradouro" class="form-label fw-semibold">Logradouro</label>
                        <input type="text" id="logradouro" name="logradouro" class="form-control">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="numero" class="form-label fw-semibold">Número</label>
                        <input type="text" id="numero" name="numero" class="form-control">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="estado" class="form-label fw-semibold">UF</label>
                        <input type="text" id="estado" name="estado" class="form-control text-uppercase" maxlength="2">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="bairro" class="form-label fw-semibold">Bairro</label>
                        <input type="text" id="bairro" name="bairro" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cidade" class="form-label fw-semibold">Cidade</label>
                        <input type="text" id="cidade" name="cidade" class="form-control">

                    <div class="col-md-4 mb-3">

                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-end mt-3">
                    <a href="oqfazer.php?aba=usuarios" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" id="btn-salvar" class="btn btn-primary px-4 fw-semibold" disabled><i class="bi bi-check2-circle me-1"></i>Salvar Alterações</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        let usuariosCarregados = [];
        let timerFiltro = null;

        function filtrarComAtraso(termo) {
            clearTimeout(timerFiltro);
            timerFiltro = setTimeout(() => carregarListaUsuarios(termo), 250);
        }

        // Só preenche a lista. O formulário NÃO troca de usuário sozinho: é preciso escolher e clicar em "Carregar".
        async function carregarListaUsuarios(termo = '') {
            const resp = await fetch(`backend/api.php?acao=buscar&tipo=usuarios&q=${encodeURIComponent(termo)}&limite=250`);
            const json = await resp.json();
            const sel = document.getElementById('select-usuario');
            usuariosCarregados = json.dados || [];
            if (usuariosCarregados.length === 0) {
                sel.innerHTML = '<option value="">Nenhum usuário encontrado</option>';
                return;
            }
            const atual = document.getElementById('id_usuario').value;
            sel.innerHTML = '<option value="">Selecione um usuário...</option>' + usuariosCarregados.map(u =>
                `<option value="${u.id_usuario}">${axionEsc(u.nome)} - CPF ${axionEsc(u.cpf_matricula)} [${axionEsc(u.perfil.toUpperCase())}]</option>`
            ).join('');
            if (atual && usuariosCarregados.some(u => String(u.id_usuario) === atual)) sel.value = atual;
            else if (usuariosCarregados.length === 1) sel.value = usuariosCarregados[0].id_usuario;
        }

        async function carregarSupervisores() {
            const resp = await fetch('backend/api.php?acao=listar_pessoas');
            const json = await resp.json();
            const sel = document.getElementById('id_supervisor');
            sel.innerHTML = '<option value="">Sem supervisor definido</option>' + (json.supervisores || []).map(s =>
                `<option value="${s.id_usuario}">${axionEsc(s.nome)}${s.perfil === 'admin' ? ' (Admin)' : ''}</option>`).join('');
        }

        function atualizarLinhaSupervisor() {
            const perfil = document.getElementById('perfil').value;
            const ehMotorista = perfil === 'motorista';
            document.getElementById('linha-supervisor').style.display = ehMotorista ? '' : 'none';
            // Motorista e cliente precisam de CNH completa
            ['cnh', 'categoria-cnh', 'validade-cnh'].forEach(id => document.getElementById(id).required = ehMotorista || perfil === 'cliente');
        }

        async function carregarUsuarioPorId(id) {
            if (!id) {
                alert('Selecione um usuário na lista.');
                return;
            }
            const resp = await fetch(`backend/api.php?acao=obter_usuario&id=${encodeURIComponent(id)}`);
            const json = await resp.json();
            if (!json.sucesso || !json.dados) return;
            const u = json.dados;
            document.getElementById('id_usuario').value = u.id_usuario;
            document.getElementById('nome').value = u.nome || '';
            document.getElementById('sobrenome').value = u.sobrenome || '';
            document.getElementById('cpf').value = u.cpf_matricula || '';
            document.getElementById('dtNascimento').value = u.data_nascimento || '';
            document.getElementById('genero').value = u.genero || 'Masculino';
            document.getElementById('perfil').value = u.perfil || 'motorista';
            document.getElementById('telefone').value = u.telefone || '';
            document.getElementById('cnh').value = u.cnh || '';
            document.getElementById('categoria-cnh').value = u.categoria_cnh || 'B';
            document.getElementById('validade-cnh').value = u.validade_cnh || '';
            document.getElementById('cep').value = u.cep || '';
            document.getElementById('logradouro').value = u.logradouro || '';
            document.getElementById('numero').value = u.numero || '';
            document.getElementById('bairro').value = u.bairro || '';
            document.getElementById('cidade').value = u.cidade || '';
            document.getElementById('estado').value = u.estado || '';
            document.getElementById('email').value = u.email || '';
            document.getElementById('id_supervisor').value = u.id_supervisor || '';
            document.getElementById('status').value = u.status || 'ativo';
            AxionFoto.montar(document.getElementById('campo-foto'), { redondo: true, titulo: 'Foto do usuário', urlAtual: u.foto_url });
            atualizarLinhaSupervisor();
            // Reaplica máscaras/validação nos valores carregados
            ['cpf', 'telefone', 'cnh'].forEach(campo => { const el = document.getElementById(campo); el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('blur')); });
            document.getElementById('btn-salvar').disabled = false;
            document.getElementById('select-usuario').value = u.id_usuario;
            document.getElementById('titulo-editando').textContent = `Editando: ${u.nome} (${u.perfil.toUpperCase()})`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const ctx = await AxionSessao.pronta;
            // Supervisor não pode promover ninguém a Admin/Supervisor
            if (ctx && ctx.usuario.perfil !== 'admin') {
                document.querySelectorAll('#perfil option[value="admin"], #perfil option[value="supervisor"]').forEach(o => o.disabled = true);
            }
            document.getElementById('perfil').addEventListener('change', atualizarLinhaSupervisor);
            await carregarSupervisores();
            await carregarListaUsuarios();
            const urlId = new URLSearchParams(window.location.search).get('id');
            if (urlId) carregarUsuarioPorId(urlId);
        });
    </script>
</body>

</html>
