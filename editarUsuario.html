<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 750px; width: 100%;">
            <h1 class="h4 text-center mb-4">Editar Usuário</h1>

            <!-- 1. BLOCO DE BUSCA -->
            <form action="buscar_usuario.php" method="get" class="mb-4 p-3 bg-light border rounded">
                <label for="select-usuario" class="form-label fw-bold">Selecione o Usuário para Editar</label>
                <div class="input-group">
                    <select id="select-usuario" name="id_usuario" class="form-select" required>
                        <option value="" selected disabled>Escolha um usuário cadastrado...</option>
                        <option value="1">João Silva (CPF: 111.222.333-44) - Motorista</option>
                        <option value="2">Maria Oliveira (CPF: 555.666.777-88) - Supervisor</option>
                    </select>
                    <button class="btn btn-outline-primary" type="submit">Carregar Dados</button>
                </div>
            </form>

            <hr class="my-4">

            <!-- 2. FORMULÁRIO DE EDIÇÃO (Iguais ao caduser.html, mas alimentado com os dados atuais) -->
            <form action="processar_edicao_usuario.php" method="post">
                <!-- ID Oculto para o Backend saber quem atualizar -->
                <input type="hidden" name="id_usuario" value="1">

                <!-- Dados Pessoais -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control" value="João" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="sobrenome" class="form-label">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" class="form-control" value="Silva" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="dtNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" name="dtNascimento" id="dtNascimento" class="form-control" value="1990-05-15" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="genero" class="form-label">Gênero</label>
                        <select name="genero" id="genero" class="form-select" required>
                            <option value="Masculino" selected>Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" id="cpf" name="cpf" class="form-control" value="111.222.333-44" required>
                    </div>
                </div>

                <!-- CNH -->
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="cnh" class="form-label">N° da CNH</label>
                        <input type="text" name="cnh" id="cnh" class="form-control" value="12345678900" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="validade-cnh" class="form-label">Validade CNH</label>
                        <input type="date" name="validade-cnh" id="validade-cnh" class="form-control" value="2028-10-20" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="categoria-cnh" class="form-label">Categoria CNH</label>
                        <input type="text" id="categoria-cnh" name="categoria-cnh" class="form-control text-uppercase" value="D" required>
                    </div>
                </div>

                <!-- Contato e Perfil -->
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" class="form-control" value="(27) 99999-8888" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" value="joao@empresa.com" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="perfil" class="form-label">Perfil de Acesso</label>
                        <select name="perfil" id="perfil" class="form-select" required>
                            <option value="supervisor">Supervisor</option>
                            <option value="motorista" selected>Motorista</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2 mt-4">
                    <input type="submit" value="Salvar Alterações" class="btn btn-primary">
                    <a href="oqfazer.php" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
