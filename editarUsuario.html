    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        async function carregarListaUsuarios(termo = '') {
            // limite=0 retorna TODOS os usuários cadastrados no banco sem cortar
            const resp = await fetch(`backend/api.php?acao=buscar&tipo=usuarios&q=${encodeURIComponent(termo)}&limite=0`);
            const json = await resp.json();
            const sel = document.getElementById('select-usuario');
            const badge = document.getElementById('contador-usuarios-select');
            if (!json.dados || json.dados.length === 0) {
                sel.innerHTML = '<option value="">Nenhum usuário encontrado</option>';
                if (badge) badge.textContent = '0 usuários encontrados';
                return;
            }
            if (badge) badge.textContent = `${json.dados.length} usuários listados`;
            sel.innerHTML = json.dados.map(u =>
                `<option value="${u.id_usuario}">#${u.id_usuario} - ${u.nome} (CPF: ${u.cpf_matricula}) [${u.perfil.toUpperCase()}]</option>`
            ).join('');

            const urlId = new URLSearchParams(window.location.search).get('id');
            if (urlId && !termo) {
                sel.value = urlId;
                carregarUsuarioPorId(urlId);
            } else if (json.dados[0]) {
                carregarUsuarioPorId(json.dados[0].id_usuario);
            }
        }

        async function carregarUsuarioPorId(id) {
            if (!id) return;
            const resp = await fetch(`backend/api.php?acao=obter_usuario&id=${id}`);
            const json = await resp.json();
            if (!json.sucesso || !json.dados) return;
            const u = json.dados;
            document.getElementById('id_usuario').value = u.id_usuario;
            // Preenche apenas o primeiro nome no campo Nome e o restante no campo Sobrenome
            document.getElementById('nome').value = u.primeiro_nome || (u.nome || '').split(' ')[0] || '';
            document.getElementById('sobrenome').value = u.sobrenome_calculado || u.sobrenome || '';
            document.getElementById('cpf').value = u.cpf_matricula || '';
            document.getElementById('dtNascimento').value = u.data_nascimento || '';
            document.getElementById('genero').value = u.genero || 'Masculino';
            document.getElementById('perfil').value = u.perfil || 'motorista';
            document.getElementById('telefone').value = u.telefone || '';
            document.getElementById('cnh').value = u.cnh || '';
            document.getElementById('categoria-cnh').value = u.categoria_cnh || 'B';
            document.getElementById('validade-cnh').value = u.validade_cnh || '';
            document.getElementById('cep').value = u.cep || '';
            document.getElementById('logradouro').value = u.logradouro || '';
            document.getElementById('numero').value = u.numero || '';
            document.getElementById('bairro').value = u.bairro || '';
            document.getElementById('cidade').value = u.cidade || '';
            document.getElementById('estado').value = u.estado || 'ES';
            document.getElementById('email').value = u.email || '';

            // Dispara as validações visuais para atualizar os indicadores dos campos carregados
            ['cpf', 'email', 'dtNascimento', 'cnh', 'validade-cnh'].forEach(idCampo => {
                const el = document.getElementById(idCampo);
                if (el) el.dispatchEvent(new Event('input'));
            });
        }

        document.addEventListener('DOMContentLoaded', () => carregarListaUsuarios());
    </script>
