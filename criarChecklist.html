<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Checklist Inteligente - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 800px; width: 100%;">
            <h1 class="h4 text-center mb-1">Criar Novo Checklist</h1>
            <p class="text-muted text-center small mb-4">Monte as perguntas principais e adicione subperguntas condicionais</p>

            <form action="salvar_checklist_dinamico.php" method="post" id="formCriarChecklist">
                <!-- Informações Básicas do Checklist -->
                <div class="mb-3">
                    <label for="tituloChecklist" class="form-label fw-bold">Título do Checklist</label>
                    <input type="text" id="tituloChecklist" name="titulo" class="form-control" placeholder="Ex: Vistoria Diária de Segurança" required>
                </div>

                <div class="mb-4">
                    <label for="categoriaChecklist" class="form-label fw-bold">Categoria</label>
                    <select id="categoriaChecklist" name="categoria" class="form-select" required>
                        <option value="" selected disabled>Selecione uma categoria...</option>
                        <option value="eletrico">Elétrico</option>
                        <option value="mecanico">Mecânico</option>
                        <option value="estetico">Estético</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <hr class="my-4">

                <h2 class="h6 fw-bold mb-3">Perguntas do Checklist</h2>

                <!-- Área onde as perguntas dinâmicas serão inseridas -->
                <div id="containerPerguntas">
                    
                    <!-- PERGUNTA 1 (PAI) -->
                    <div class="card p-3 mb-3 bg-white border pergunta-item" id="pergunta_1">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-primary fs-6">Pergunta 1</span>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerPergunta('pergunta_1')">Excluir Pergunta 1</button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Texto da Pergunta</label>
                            <input type="text" name="perguntas[1][texto]" class="form-control" placeholder="Ex: O veículo possui alguma avaria na lataria?" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-semibold">Tipo de Resposta</label>
                                <select name="perguntas[1][tipo]" class="form-select" required>
                                    <option value="sim_nao" selected>Sim / Não</option>
                                    <option value="texto">Texto Curto (Observação)</option>
                                    <option value="numero">Número (Ex: Quilometragem/Pressão)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-2 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" name="perguntas[1][obrigatorio]" value="1" id="req_1" checked>
                                    <label class="form-check-label" for="req_1">Resposta Obrigatória</label>
                                </div>
                            </div>
                        </div>

                        <!-- CONTAINER DE SUBPERGUNTAS DA PERGUNTA 1 -->
                        <div id="subperguntas_container_1" class="ms-4 ps-3 border-start border-3 border-primary mb-3">
                            <!-- As subperguntas serão inseridas aqui dinamicamente -->
                        </div>

                        <!-- Botão para Inserir Subpergunta -->
                        <div class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="adicionarSubpergunta(1)">
                                + Adicionar Subpergunta (Condicional)
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Botão para Adicionar Pergunta Principal -->
                <div class="mb-4 text-center">
                    <button type="button" class="btn btn-outline-success w-100" onclick="adicionarPergunta()">
                        + Adicionar Nova Pergunta Principal
                    </button>
                </div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2">
                    <input type="submit" value="Salvar Checklist" class="btn btn-primary">
                    <a href="oqfazer.php" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JavaScript Dinâmico -->
    <script>
        let contadorPerguntas = 1;
        // Objeto para controlar a contagem independente de subperguntas de cada pergunta pai
        let contadoresSubperguntas = { 1: 0 };

        // Adiciona uma Pergunta Principal (Pai)
        function adicionarPergunta() {
            contadorPerguntas++;
            contadoresSubperguntas[contadorPerguntas] = 0; // Inicializa o contador de filhas da nova pergunta

            const container = document.getElementById('containerPerguntas');
            
            const novoHtml = `
                <div class="card p-3 mb-3 bg-white border pergunta-item" id="pergunta_${contadorPerguntas}">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-primary fs-6">Pergunta ${contadorPerguntas}</span>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerPergunta('pergunta_${contadorPerguntas}')">Excluir Pergunta ${contadorPerguntas}</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Texto da Pergunta</label>
                        <input type="text" name="perguntas[${contadorPerguntas}][texto]" class="form-control" placeholder="Digite a pergunta principal..." required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-semibold">Tipo de Resposta</label>
                            <select name="perguntas[${contadorPerguntas}][tipo]" class="form-select" required>
                                <option value="sim_nao" selected>Sim / Não</option>
                                <option value="texto">Texto Curto (Observação)</option>
                                <option value="numero">Número (Ex: Quilometragem/Pressão)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="perguntas[${contadorPerguntas}][obrigatorio]" value="1" id="req_${contadorPerguntas}" checked>
                                <label class="form-check-label" for="req_${contadorPerguntas}">Resposta Obrigatória</label>
                            </div>
                        </div>
                    </div>

                    <!-- CONTAINER DE SUBPERGUNTAS -->
                    <div id="subperguntas_container_${contadorPerguntas}" class="ms-4 ps-3 border-start border-3 border-primary mb-3"></div>

                    <!-- Botão para Inserir Subpergunta -->
                    <div class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="adicionarSubpergunta(${contadorPerguntas})">
                            + Adicionar Subpergunta (Condicional)
                        </button>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', novoHtml);
        }

        // Adiciona uma Subpergunta (Filha) aninhada à pergunta pai correspondente
        function adicionarSubpergunta(idPai) {
            contadoresSubperguntas[idPai]++;
            const subId = contadoresSubperguntas[idPai];
            const containerSub = document.getElementById(`subperguntas_container_${idPai}`);

            const subHtml = `
                <div class="card p-3 mb-2 bg-light border subpergunta-item" id="subpergunta_${idPai}_${subId}">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-info text-dark">Subpergunta ${idPai}.${subId}</span>
                        <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0" onclick="removerElemento('subpergunta_${idPai}_${subId}')">Remover Subpergunta</button>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <label class="form-label small fw-bold text-primary">Exibir se Pergunta ${idPai} for:</label>
                            <select name="perguntas[${idPai}][subperguntas][${subId}][condicao]" class="form-select form-select-sm">
                                <option value="sim" selected>Sim</option>
                                <option value="nao">Não</option>
                            </select>
                        </div>
                        <div class="col-md-8 mb-2">
                            <label class="form-label small fw-bold">Texto da Subpergunta ${idPai}.${subId}</label>
                            <input type="text" name="perguntas[${idPai}][subperguntas][${subId}][texto]" class="form-control form-control-sm" placeholder="Ex: Qual o local e tamanho da avaria?" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label small fw-semibold">Tipo de Resposta</label>
                            <select name="perguntas[${idPai}][subperguntas][${subId}][tipo]" class="form-select form-select-sm" required>
                                <option value="texto" selected>Texto Curto (Observação)</option>
                                <option value="sim_nao">Sim / Não</option>
                                <option value="numero">Número</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2 d-flex align-items-end">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="perguntas[${idPai}][subperguntas][${subId}][obrigatorio]" value="1" id="sub_req_${idPai}_${subId}" checked>
                                <label class="form-check-label small" for="sub_req_${idPai}_${subId}">Obrigatória se visível</label>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            containerSub.insertAdjacentHTML('beforeend', subHtml);
        }

        function removerPergunta(idElemento) {
            const listaPerguntas = document.querySelectorAll('.pergunta-item');
            if (listaPerguntas.length > 1) {
                document.getElementById(idElemento).remove();
            } else {
                alert('O checklist deve conter pelo menos uma pergunta principal.');
            }
        }

        function removerElemento(idElemento) {
            document.getElementById(idElemento).remove();
        }
    </script>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
