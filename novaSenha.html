<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Nova Senha - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
            <h1 class="h4 mb-3 text-center">Cadastrar Nova Senha</h1>
            <p class="text-muted text-center small mb-4">Digite sua nova senha abaixo.</p>

            <form action="processar_nova_senha.php" method="post">
                <!-- Campo Oculto para enviar o Token recebido pela URL ao PHP -->
                <input type="hidden" name="token" value="TOKEN_GERADO_AQUI">

                <div class="mb-3">
                    <label for="novaSenha" class="form-label">Nova Senha</label>
                    <input type="password" name="txtNovaSenha" id="novaSenha" class="form-control" placeholder="Digite a nova senha" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">Confirmar Nova Senha</label>
                    <input type="password" name="txtConfirmarSenha" id="confirmarSenha" class="form-control" placeholder="Confirme a nova senha" required>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <input type="submit" value="Salvar Nova Senha" class="btn btn-primary">
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
