<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta de cliente - Axion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
    <link rel="icon" type="image/png" href="frontend/img/favicon.png">
</head>

<body class="bg-light">
    <nav class="axion-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="axion-brand"><img src="frontend/img/logo.png" class="axion-logo" alt="Logo Axion"><span>AXION</span><span class="axion-brand-badge">Locação de veículos</span></a>
            <a href="index.html" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-in-right me-1"></i>Já tenho conta</a>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 860px">
        <div class="axion-form-card">
            <h1 class="h4 fw-bold mb-1"><i class="bi bi-person-plus text-primary me-2"></i>Criar conta para alugar</h1>
            <p class="text-muted mb-3">Preencha seus dados. A empresa confere o cadastro e libera o acesso; depois é só entrar com o seu e-mail e senha.</p>

            <div class="alert alert-success d-none" id="msg-ok" role="status"></div>

            <form id="form-cadastro" novalidate>
                <!-- Campo escondido contra robôs -->
                <input type="text" name="site" tabindex="-1" autocomplete="off" class="d-none" aria-hidden="true">

                <div class="axion-section-title"><i class="bi bi-person"></i> Seus dados</div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6"><label for="nome" class="form-label fw-semibold">Nome</label><input id="nome" name="nome" class="form-control" required autocomplete="given-name"></div>
                    <div class="col-md-6"><label for="sobrenome" class="form-label fw-semibold">Sobrenome</label><input id="sobrenome" name="sobrenome" class="form-control" required autocomplete="family-name"></div>
                    <div class="col-md-4"><label for="cpf" class="form-label fw-semibold">CPF</label><input id="cpf" name="cpf" class="form-control" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
                    <div class="col-md-4"><label for="dtNascimento" class="form-label fw-semibold">Data de nascimento</label><input type="date" id="dtNascimento" name="dtNascimento" class="form-control" required></div>
                    <div class="col-md-4"><label for="telefone" class="form-label fw-semibold">Celular</label><input id="telefone" name="telefone" class="form-control" required inputmode="tel" maxlength="15" placeholder="(27) 99999-9999" autocomplete="tel"></div>
                </div>

                <div class="axion-section-title"><i class="bi bi-person-vcard"></i> Habilitação (CNH)</div>
                <div class="row g-3 mb-3">
                    <div class="col-md-5"><label for="cnh" class="form-label fw-semibold">Número da CNH</label><input id="cnh" name="cnh" class="form-control" required inputmode="numeric" maxlength="11" placeholder="11 dígitos"></div>
                    <div class="col-md-3">
                        <label for="categoria_cnh" class="form-label fw-semibold">Categoria</label>
                        <select id="categoria_cnh" name="categoria_cnh" class="form-select" required>
                            <option value="">Escolha...</option>
                            <option>B</option><option>AB</option><option>C</option><option>D</option><option>E</option><option>A</option>
                        </select>
                    </div>
                    <div class="col-md-4"><label for="validade_cnh" class="form-label fw-semibold">Validade</label><input type="date" id="validade_cnh" name="validade_cnh" class="form-control" required></div>
                </div>

                <div class="axion-section-title"><i class="bi bi-geo-alt"></i> Endereço <span class="text-muted fw-normal small">(opcional)</span></div>
                <div class="row g-3 mb-3">
                    <div class="col-md-3"><label for="cep" class="form-label fw-semibold">CEP</label><input id="cep" name="cep" class="form-control" inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
                    <div class="col-md-7"><label for="logradouro" class="form-label fw-semibold">Rua</label><input id="logradouro" name="logradouro" class="form-control"></div>
                    <div class="col-md-2"><label for="numero" class="form-label fw-semibold">Número</label><input id="numero" name="numero" class="form-control"></div>
                    <div class="col-md-5"><label for="bairro" class="form-label fw-semibold">Bairro</label><input id="bairro" name="bairro" class="form-control"></div>
                    <div class="col-md-5"><label for="cidade" class="form-label fw-semibold">Cidade</label><input id="cidade" name="cidade" class="form-control"></div>
                    <div class="col-md-2"><label for="estado" class="form-label fw-semibold">UF</label><input id="estado" name="estado" class="form-control text-uppercase" maxlength="2"></div>
                </div>

                <div class="axion-section-title"><i class="bi bi-envelope-at"></i> Acesso</div>
                <div class="row g-3 mb-3">
                    <div class="col-md-12"><label for="email" class="form-label fw-semibold">E-mail</label><input type="email" id="email" name="email" class="form-control" required autocomplete="email"></div>
                    <div class="col-md-6"><label for="senha" class="form-label fw-semibold">Senha</label><input type="password" id="senha" name="senha" class="form-control" required minlength="6" autocomplete="new-password"><div class="form-text">Pelo menos 6 caracteres.</div></div>
                    <div class="col-md-6"><label for="confirmar_senha" class="form-label fw-semibold">Confirmar senha</label><input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required minlength="6" autocomplete="new-password"></div>
                </div>

                <div class="alert alert-danger d-none" id="msg-erro" role="alert"></div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold" id="btn-enviar"><i class="bi bi-send me-1"></i>Enviar cadastro</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const soDigitos = (v) => v.replace(/\D/g, '');
        // Máscaras simples
        $('cpf').addEventListener('input', (e) => {
            const d = soDigitos(e.target.value).slice(0, 11);
            e.target.value = d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        });
        $('telefone').addEventListener('input', (e) => {
            const d = soDigitos(e.target.value).slice(0, 11);
            e.target.value = d.length > 10 ? d.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3') : d.replace(/(\d{2})(\d{0,4})(\d{0,4})/, '($1) $2-$3').replace(/-$/, '');
        });
        $('cnh').addEventListener('input', (e) => { e.target.value = soDigitos(e.target.value).slice(0, 11); });
        $('cep').addEventListener('input', (e) => { const d = soDigitos(e.target.value).slice(0, 8); e.target.value = d.replace(/(\d{5})(\d)/, '$1-$2'); });
        // Preenche o endereço pelo CEP (ViaCEP)
        $('cep').addEventListener('blur', async () => {
            const cep = soDigitos($('cep').value);
            if (cep.length !== 8) return;
            try {
                const j = await (await fetch(`https://viacep.com.br/ws/${cep}/json/`)).json();
                if (j.erro) return;
                $('logradouro').value = j.logradouro || ''; $('bairro').value = j.bairro || '';
                $('cidade').value = j.localidade || ''; $('estado').value = j.uf || '';
                $('numero').focus();
            } catch (e) { /* sem internet: preenche à mão */ }
        });
        $('validade_cnh').min = new Date().toISOString().slice(0, 10);

        $('form-cadastro').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const erro = $('msg-erro');
            erro.classList.add('d-none');
            if (!ev.target.checkValidity()) { ev.target.reportValidity(); return; }
            if ($('senha').value !== $('confirmar_senha').value) {
                erro.textContent = 'A confirmação da senha não confere.'; erro.classList.remove('d-none'); return;
            }
            $('btn-enviar').disabled = true;
            let j;
            try {
                j = await (await fetch('processar_autocadastro.php', { method: 'POST', body: new FormData(ev.target) })).json();
            } catch (e) { j = { sucesso: false, erro: 'Não foi possível enviar agora. Tente de novo.' }; }
            $('btn-enviar').disabled = false;
            if (!j.sucesso) { erro.textContent = j.erro; erro.classList.remove('d-none'); return; }
            ev.target.classList.add('d-none');
            $('msg-ok').innerHTML = `<i class="bi bi-check-circle-fill me-1"></i>${j.mensagem}<div class="mt-3"><a href="index.html" class="btn btn-success">Voltar ao login</a></div>`;
            $('msg-ok').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>

</html>
