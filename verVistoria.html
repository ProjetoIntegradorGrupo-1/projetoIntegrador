<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Preenchida - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
    <style>
        .assinatura-img { max-width: 100%; height: 120px; object-fit: contain; border: 1px solid #dee2e6; border-radius: 6px; background: #fff; }
        .foto-evidencia { max-width: 100%; max-height: 420px; border-radius: 6px; }
        @media print { .axion-navbar, .nao-imprimir { display: none !important; } }
    </style>
</head>

<body>
    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Vistoria Preenchida</span>
            </a>
            <div class="d-flex gap-2">
                <a href="oqfazer.php?aba=checklists" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-search me-1"></i>Histórico de Vistorias</a>
                <a href="oqfazer.php" class="btn btn-sm btn-outline-light"><i class="bi bi-grid-1x2 me-1"></i>Painel Principal</a>
            </div>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card" style="max-width: 980px;" id="conteudo">
            <div class="text-muted">Carregando vistoria...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        const e = axionEsc;

        function badgeResultado(st) {
            if (st === 'conforme') return '<span class="badge bg-success fs-6">Conforme</span>';
            if (st === 'nao_conforme') return '<span class="badge bg-danger fs-6">Não Conforme</span>';
            return `<span class="badge bg-secondary fs-6">${e(st)}</span>`;
        }

        function dataBR(d) {
            if (!d) return '-';
            const [a, m, dia] = d.slice(0, 10).split('-');
            return `${dia}/${m}/${a}`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const box = document.getElementById('conteudo');
            const resp = await fetch(`backend/api.php?acao=obter_vistoria&id=${encodeURIComponent(id)}`, { headers: { Accept: 'application/json' } });
            if (resp.status === 401) { window.location.href = 'index.html'; return; }
            const json = await resp.json();
            if (!json.sucesso) { box.innerHTML = `<div class="alert alert-danger mb-0">${e(json.erro || 'Vistoria não encontrada.')}</div>`; return; }
            const v = json.dados;

            let n = 0;
            const linhas = (v.respostas || []).map(r => {
                const ehSub = r.id_pergunta_pai !== null;
                const conf = r.conforme === null ? '<span class="text-muted">-</span>'
                    : Number(r.conforme) === 1 ? '<span class="badge bg-success-subtle text-success">OK</span>'
                    : '<span class="badge bg-danger">Fora do padrão</span>';
                return `<tr class="${r.conforme !== null && Number(r.conforme) === 0 ? 'table-danger' : ''}">
                    <td class="small text-muted">${ehSub ? '↳' : ++n}</td>
                    <td class="${ehSub ? 'ps-4 small' : ''}">${e(r.pergunta_texto)}</td>
                    <td class="fw-semibold">${e(r.resposta || '-')}</td>
                    <td class="small text-muted">${e(r.resposta_esperada || '-')}</td>
                    <td>${conf}</td>
                </tr>`;
            }).join('');

            const pendente = !v.assinado_em;
            const precisaDetalhes = v.status_conformidade === 'nao_conforme' && !v.detalhes_nao_conformidade;
            const acaoPendente = pendente && v.pode_assinar
                ? `<a class="btn btn-warning fw-semibold" href="${precisaDetalhes ? 'detalhesNaoConformidade.html' : 'assinaturaChecklist.html'}?id=${v.id_execucao}">
                       <i class="bi bi-pen me-1"></i>${precisaDetalhes ? 'Descrever avaria e assinar' : 'Colher assinaturas'}</a>` : '';

            box.innerHTML = `
                ${params.get('sucesso') ? '<div class="alert alert-success">Vistoria concluída e assinada com sucesso!</div>' : ''}
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                    <div>
                        <h1 class="h4 fw-bold mb-1"><i class="bi bi-clipboard2-check-fill text-success me-2"></i>Vistoria #${v.id_execucao}</h1>
                        <div class="text-muted">${e(v.checklist_titulo)}</div>
                    </div>
                    <div class="text-end">
                        ${badgeResultado(v.status_conformidade)}
                        <div class="small mt-1">${pendente ? '<span class="badge bg-warning text-dark">Assinatura pendente</span>' : `<span class="text-success"><i class="bi bi-patch-check-fill"></i> Assinada em ${dataBR(v.assinado_em)} ${e(v.assinado_em.slice(11, 16))}</span>`}</div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        <div class="small text-muted">Veículo</div>
                        <div class="fw-bold font-monospace">${e(v.placa_veiculo)}</div>
                        <div class="small">${e(v.marca_modelo || '')} ${e(v.ano || '')} ${e(v.cor || '')}</div>
                        <div class="small">Km: ${Number(v.km_rodado || 0).toLocaleString('pt-BR')}</div>
                    </div></div>
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        <div class="small text-muted">Motorista</div><div class="fw-semibold">${e(v.nome_motorista)}</div>
                        <div class="small text-muted mt-2">Vistoriador</div><div class="fw-semibold">${e(v.nome_vistoriador)}</div>
                    </div></div>
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        <div class="small text-muted">Data / Hora</div>
                        <div class="fw-semibold">${dataBR(v.data_vistoria)} ${e((v.hora_vistoria || '').slice(0, 5))}</div>
                        <div class="small text-muted mt-2">Observações</div><div class="small">${e(v.observacoes || '-')}</div>
                    </div></div>
                </div>

                <div class="axion-section-title"><i class="bi bi-list-check"></i> Respostas</div>
                ${linhas ? `<div class="table-responsive mb-3"><table class="table table-sm align-middle">
                    <thead><tr><th>#</th><th>Pergunta</th><th>Resposta</th><th>Esperado</th><th>Situação</th></tr></thead>
                    <tbody>${linhas}</tbody></table></div>`
                    : '<p class="text-muted small">Esta vistoria não tem respostas registradas (registrada antes desta versão do sistema).</p>'}

                ${v.status_conformidade === 'nao_conforme' ? `
                <div class="axion-section-title"><i class="bi bi-exclamation-triangle"></i> Não conformidade</div>
                <p class="mb-2" style="white-space: pre-wrap">${e(v.detalhes_nao_conformidade || 'Sem descrição registrada.')}</p>
                ${v.foto_url ? `<img class="foto-evidencia mb-3" src="${e(v.foto_url)}" alt="Foto da avaria">` : ''}` : ''}

                <div class="axion-section-title"><i class="bi bi-pen"></i> Assinaturas</div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <div class="small text-muted mb-1">Motorista: ${e(v.nome_motorista)}</div>
                        ${v.assinatura_motorista ? `<img class="assinatura-img w-100" src="${e(v.assinatura_motorista)}" alt="Assinatura do motorista">` : '<div class="text-muted small">Não assinada</div>'}
                    </div>
                    <div class="col-md-6">
                        <div class="small text-muted mb-1">Vistoriador: ${e(v.nome_vistoriador)}</div>
                        ${v.assinatura_vistoriador ? `<img class="assinatura-img w-100" src="${e(v.assinatura_vistoriador)}" alt="Assinatura do vistoriador">` : '<div class="text-muted small">Não assinada</div>'}
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-end nao-imprimir">
                    ${acaoPendente}
                    <button class="btn btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Imprimir / PDF</button>
                    <a href="oqfazer.php?aba=checklists" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>`;
        });
    </script>
</body>

</html>
