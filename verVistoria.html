        .rel-tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 8pt; font-weight: 700; white-space: nowrap; }

        .rel-tag.nok { background: #c0392b; color: #fff; }
        .rel-resumo { display: flex; gap: 8px; margin-top: 8px; }
        .rel-resumo div { flex: 1; border: 1px solid #dde3ea; border-radius: 6px; padding: 6px; text-align: center; }

        .rel-foto { max-width: 100%; max-height: 80mm; border: 1px solid #dde3ea; border-radius: 6px; margin-top: 8px; }

<body data-secao="vistorias" data-titulo="Detalhes da vistoria">
    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <img src="frontend/img/logo.png" class="axion-logo" alt="Logo Axion">
                <span>AXION</span>
                <span class="axion-brand-badge">Vistoria Preenchida</span>
            </a>
            <div class="d-flex gap-2">
                <a href="oqfazer.php?aba=vistorias" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-search me-1"></i>Histórico de Vistorias</a>
                <a href="oqfazer.php" class="btn btn-sm btn-outline-light"><i class="bi bi-grid-1x2 me-1"></i>Painel Principal</a>
            </div>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card" style="max-width: 980px;" id="conteudo">
            <div class="text-muted">Carregando vistoria...</div>
        </div>
    </main>

    <!-- Relatório formatado (só aparece na impressão / PDF) -->
    <div id="relatorio" class="rel"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/axion.js"></script>
    <script>
        const e = axionEsc;
        // "sim"/"nao" gravados no banco aparecem como "Sim"/"Não"
        const fmtResp = (r) => ({ sim: 'Sim', nao: 'Não' }[String(r ?? '').toLowerCase()] ?? (r || '-'));

        function badgeResultado(st) {
            if (st === 'conforme') return '<span class="badge bg-success fs-6">Conforme</span>';
            if (st === 'nao_conforme') return '<span class="badge bg-danger fs-6">Não Conforme</span>';
            return `<span class="badge bg-secondary fs-6">${e(st)}</span>`;
        }

        function dataBR(d) {
            if (!d) return '-';
            const [a, m, dia] = d.slice(0, 10).split('-');
            return `${dia}/${m}/${a}`;
        }

        async function recusar() {
            const motivo = prompt('Informe o motivo da recusa. Este texto ficará visível na vistoria:');
            if (motivo === null) return;
            if (motivo.trim().length < 5) { alert('Descreva o motivo da recusa com pelo menos 5 caracteres.'); return; }
            const ctx = await AxionSessao.pronta;
            const fd = new FormData();
            fd.append('id_execucao', new URLSearchParams(window.location.search).get('id'));
            fd.append('csrf', ctx.csrf);
            fd.append('motivo', motivo.trim());
            const resp = await fetch('backend/api.php?acao=recusar_vistoria', { method: 'POST', body: fd, headers: { Accept: 'application/json' } });
            const json = await resp.json();
            if (!json.sucesso) { alert(json.erro || 'Não foi possível recusar.'); return; }
            window.location.href = json.redirecionar;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const box = document.getElementById('conteudo');
            const resp = await fetch(`backend/api.php?acao=obter_vistoria&id=${encodeURIComponent(id)}`, { headers: { Accept: 'application/json' } });
            if (resp.status === 401) { window.location.href = 'index.html'; return; }
            const json = await resp.json();
            if (!json.sucesso) { box.innerHTML = `<div class="alert alert-danger mb-0">${e(json.erro || 'Vistoria não encontrada.')}</div>`; return; }
            const v = json.dados;
            // Na locação, quem fica no lugar do motorista é o cliente; o supervisor assina como testemunha
            const rotMot = v.id_locacao ? 'Cliente' : 'Motorista';
            const rotVist = v.id_locacao ? 'Testemunha (supervisor)' : 'Vistoriador';
            const ehClienteLogado = json.usuario && json.usuario.perfil === 'cliente';
            const tipoNome = { retirada: 'retirada', devolucao: 'devolução' };
            let blocoLocacao = '';
            if (v.id_locacao && v.locacao) {
                const outra = (v.outras_vistorias_locacao || []).find(x => x.tipo_locacao !== v.tipo_locacao);
                blocoLocacao = `<div class="alert alert-info d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div><i class="bi bi-key-fill me-1"></i><strong>Vistoria de ${tipoNome[v.tipo_locacao] || ''}</strong> da locação #${v.locacao.id_locacao}
                        (${dataBR(v.locacao.data_retirada)} a ${dataBR(v.locacao.data_devolucao)})</div>
                    ${outra ? `<a class="btn btn-sm btn-outline-primary" href="verVistoria.html?id=${outra.id_execucao}"><i class="bi bi-arrow-left-right me-1"></i>Comparar com a vistoria de ${tipoNome[outra.tipo_locacao]}
                        (${outra.status_conformidade === 'nao_conforme' ? 'com avaria' : 'sem avaria'})</a>` : ''}
                </div>`;
            }

            const NOMES_CAT = { eletrico: 'Elétrico', mecanico: 'Mecânico', estetico: 'Estético', seguranca: 'Segurança', pre_viagem: 'Pré-viagem', locacao: 'Locação', outros: 'Outros' };
            let n = 0;
            const linhas = (v.respostas || []).map(r => {
                const ehSub = r.id_pergunta_pai !== null;
                const conf = r.conforme === null ? '<span class="text-muted">-</span>'
                    : Number(r.conforme) === 1 ? '<span class="badge bg-success-subtle text-success">OK</span>'
                    : '<span class="badge bg-danger">Fora do padrão</span>';
                const badgeCat = (!ehSub && r.categoria)
                    ? ` <span class="badge bg-light text-secondary border ms-1">${e(NOMES_CAT[r.categoria] || r.categoria)}</span>`
                    : '';
                return `<tr class="${r.conforme !== null && Number(r.conforme) === 0 ? 'table-danger' : ''}">
                    <td class="small text-muted">${ehSub ? '↳' : ++n}</td>
                    <td class="${ehSub ? 'ps-4 small' : ''}">${e(r.pergunta_texto)}${badgeCat}</td>
                    <td class="fw-semibold">${e(fmtResp(r.resposta))}</td>
                    <td class="small text-muted">${r.resposta_esperada ? e(fmtResp(r.resposta_esperada)) : '-'}</td>
                    <td>${conf}</td>
                </tr>`;
            }).join('');

            const precisaDetalhes = v.status_conformidade === 'nao_conforme' && !v.detalhes_nao_conformidade && v.pode_editar_avaria;
            const outroAssinou = v.meu_papel === 'motorista' ? v.assinado_vistoriador_em : v.assinado_motorista_em;
            let acaoPendente = '';
            if (v.pode_assinar) {
                acaoPendente = `<a class="btn btn-warning fw-semibold" href="${precisaDetalhes ? 'detalhesNaoConformidade.html' : 'assinaturaChecklist.html'}?id=${v.id_execucao}">
                    <i class="bi bi-pen me-1"></i>${precisaDetalhes ? 'Descrever avaria e assinar' : (v.meu_papel === 'vistoriador' && outroAssinou ? 'Aprovar e assinar' : 'Assinar')}</a>`;
                if (outroAssinou) acaoPendente += ` <button class="btn btn-outline-danger" onclick="recusar()"><i class="bi bi-x-circle me-1"></i>Recusar</button>`;
            }
            if (v.pode_corrigir) acaoPendente = `<a class="btn btn-outline-warning" href="cadcheck.html?editar=${v.id_execucao}"><i class="bi bi-pencil-square me-1"></i>Corrigir respostas</a> ` + acaoPendente;
            const situacoes = {
                concluida: `<span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle"><i class="bi bi-patch-check-fill me-1"></i>Concluída${v.assinado_em ? ' em ' + dataBR(v.assinado_em) + ' ' + e(v.assinado_em.slice(11, 16)) : ''}</span>`,
                aguardando_vistoriador: `<span class="badge bg-warning text-dark">Aguardando assinatura do supervisor</span>`,
                aguardando_motorista: `<span class="badge bg-warning text-dark">Aguardando assinatura do ${rotMot.toLowerCase()}</span>`,
                aguardando_assinaturas: `<span class="badge bg-secondary">Ainda não assinada</span>`,
                recusada: `<span class="badge bg-dark">Recusada</span>`
            };
            const fmtAss = (img, em) => img === true ? `<div class="small text-success">Assinada ${em ? 'em ' + dataBR(em) : ''}</div>`
                : img ? `<img class="assinatura-img w-100" src="${e(img)}" alt="Assinatura"><div class="small text-muted">${em ? dataBR(em) + ' ' + e(em.slice(11, 16)) : ''}</div>`
                : '<div class="text-muted small">Aguardando assinatura</div>';
            // Mensagem após assinar/recusar, com o nome de quem recebe a solicitação
            const destinatario = v.meu_papel === 'motorista' ? v.nome_vistoriador : v.nome_motorista;
            const mensagens = {
                enviada: ['success', 'bi-send-check-fill', v.meu_papel === 'motorista'
                    ? `Sua assinatura foi registrada. A vistoria foi enviada para <strong>${e(destinatario)}</strong> revisar e aprovar.`
                    : `Sua assinatura foi registrada. A vistoria foi enviada para <strong>${e(destinatario)}</strong> conferir e assinar.`],
                concluida: ['success', 'bi-patch-check-fill', Number(v.enviado_manutencao) === 1
                    ? 'Vistoria aprovada e concluída. O veículo foi enviado para manutenção.'
                    : 'Vistoria aprovada e concluída.'],
                recusada: ['secondary', 'bi-x-octagon-fill', `Vistoria recusada. <strong>${e(v.nome_motorista)}</strong> poderá ver o motivo informado.`]
            };
            const msg = mensagens[params.get('sucesso')];

            box.innerHTML = `
                ${blocoLocacao}
                ${msg ? `<div class="alert alert-${msg[0]} alert-dismissible fade show d-flex align-items-center gap-2"><i class="bi ${msg[1]} fs-5"></i><div>${msg[2]}</div><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button></div>` : ''}
                ${v.situacao === 'recusada' && ehClienteLogado ? '<div class="alert alert-info"><i class="bi bi-tools me-1"></i>Vamos resolver seu problema antes de liberar o veículo para você. O supervisor vai refazer a vistoria junto com você.</div>' : ''}
                ${v.situacao === 'recusada' && !ehClienteLogado ? `<div class="alert alert-dark"><i class="bi bi-x-octagon-fill me-1"></i><strong>Recusada por ${e(v.recusado_por_nome || '')} em ${dataBR(v.recusado_em)}:</strong> ${e(v.motivo_recusa)}</div>` : ''}
                ${Number(v.enviado_manutencao) === 1 && !msg ? '<div class="alert alert-warning py-2"><i class="bi bi-tools me-1"></i>Veículo enviado para manutenção na aprovação desta vistoria.</div>' : ''}
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                    <div>
                        <h1 class="h4 fw-bold mb-1"><i class="bi bi-clipboard2-check-fill text-success me-2"></i>Vistoria #${v.id_execucao}</h1>
                        <div class="text-muted">${e(v.checklist_titulo)}</div>
                    </div>
                    <div class="text-end">
                        ${badgeResultado(v.status_conformidade)}
                        <div class="small mt-1">${situacoes[v.situacao] || ''}</div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        ${v.veiculo_foto_url ? `<img src="${e(v.veiculo_foto_url)}" alt="" class="w-100 mb-2" style="height:120px;object-fit:cover;border-radius:8px">` : ''}
                        <div class="small text-muted">Veículo</div>
                        <div class="fw-bold font-monospace">${e(v.placa_veiculo)}</div>
                        <div class="small">${e(v.marca_modelo || '')} ${e(v.ano || '')} ${e(v.cor || '')}</div>
                        <div class="small font-monospace">Km: ${Number(v.km_rodado || 0).toLocaleString('pt-BR')}</div>
                    </div></div>
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        <div class="small text-muted">${rotMot}</div>
                        <div class="fw-semibold d-flex align-items-center gap-2">${axionAvatar(v.motorista_foto_url, v.nome_motorista, 28).replace('axion-avatar', 'axion-avatar borda-escura')}${e(v.nome_motorista)}</div>
                        <div class="small text-muted mt-2">${rotVist}</div>
                        <div class="fw-semibold d-flex align-items-center gap-2">${axionAvatar(v.vistoriador_foto_url, v.nome_vistoriador, 28).replace('axion-avatar', 'axion-avatar borda-escura')}${e(v.nome_vistoriador)}</div>
                    </div></div>
                    <div class="col-md-4"><div class="p-3 bg-light rounded border h-100">
                        <div class="small text-muted">Data / Hora</div>
                        <div class="fw-semibold">${dataBR(v.data_vistoria)} ${e((v.hora_vistoria || '').slice(0, 5))}</div>
                        <div class="small text-muted mt-2">Observações</div><div class="small">${e(v.observacoes || '-')}</div>
                    </div></div>
                </div>

                <div class="axion-section-title"><i class="bi bi-list-check"></i> Respostas</div>
                ${linhas ? `<div class="table-responsive mb-3"><table class="table table-sm align-middle">
                    <thead><tr><th>#</th><th>Pergunta</th><th>Resposta</th><th>Esperado</th><th>Situação</th></tr></thead>
                    <tbody>${linhas}</tbody></table></div>`
                    : '<p class="text-muted small">Esta vistoria não tem respostas registradas (registrada antes desta versão do sistema).</p>'}

                ${v.status_conformidade === 'nao_conforme' ? `
                <div class="axion-section-title"><i class="bi bi-exclamation-triangle"></i> Não conformidade</div>
                <p class="mb-2" style="white-space: pre-wrap">${e(v.detalhes_nao_conformidade || 'Sem descrição registrada.')}</p>
                ${v.foto_url ? `<img class="foto-evidencia mb-3" src="${e(v.foto_url)}" alt="Foto da avaria">` : ''}` : ''}

                <div class="axion-section-title"><i class="bi bi-pen"></i> Assinaturas</div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <div class="small text-muted mb-1">${rotMot}: ${e(v.nome_motorista)}</div>
                        ${fmtAss(v.assinatura_motorista, v.assinado_motorista_em)}
                    </div>
                    <div class="col-md-6">
                        <div class="small text-muted mb-1">${rotVist}: ${e(v.nome_vistoriador)}</div>
                        ${fmtAss(v.assinatura_vistoriador, v.assinado_vistoriador_em)}
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 justify-content-end nao-imprimir">
                    ${acaoPendente}
                    <button class="btn btn-outline-secondary" onclick="imprimirRelatorio()"><i class="bi bi-file-earmark-pdf me-1"></i>Gerar relatório (PDF)</button>
                    <a href="oqfazer.php?aba=${ehClienteLogado ? 'locacoes' : (v.id_locacao ? 'locacoes' : 'vistorias')}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>`;
            montarRelatorio(v);
        });

        // Relatório de vistoria em formato de documento (A4), usado ao imprimir ou salvar em PDF
        let tituloArquivo = document.title;
        function montarRelatorio(v) {
            const agora = new Date();
            const emitido = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toTimeString().slice(0, 5);
            const numero = String(v.id_execucao).padStart(5, '0');
            const ok = v.status_conformidade !== 'nao_conforme';
            const nomesSituacao = {
                concluida: 'Concluída', aguardando_vistoriador: 'Aguardando supervisor',
                aguardando_motorista: 'Aguardando motorista', aguardando_assinaturas: 'Não assinada', recusada: 'Recusada'
            };
            const categorias = { eletrico: 'Elétrico', mecanico: 'Mecânico', estetico: 'Estético', seguranca: 'Segurança', pre_viagem: 'Pré-viagem', locacao: 'Locação', outros: 'Outros' };
            const dataHora = (d) => d ? `${dataBR(d)} ${e(d.slice(11, 16))}` : '-';

            const resumoCatsRel = (v.checklist_categorias || v.checklist_categoria || '')
                .split(',').map(s => s.trim()).filter(Boolean)
                .map(k => categorias[k] || k).join(', ') || '-';
            let n = 0, totalAvaliados = 0, foraPadrao = 0;
            const linhas = (v.respostas || []).map(r => {
                const ehSub = r.id_pergunta_pai !== null;
                const avaliada = r.conforme !== null;
                const fora = avaliada && Number(r.conforme) === 0;
                if (avaliada) { totalAvaliados++; if (fora) foraPadrao++; }
                const sit = !avaliada ? '<span style="color:#8a96a3">—</span>'
                    : fora ? '<span class="rel-tag nok">FORA DO PADRÃO</span>' : '<span class="rel-tag ok">OK</span>';
                const catTag = (!ehSub && r.categoria) ? ` <span style="font-size:8pt;color:#6b7785">[${e(categorias[r.categoria] || r.categoria)}]</span>` : '';
                return `<tr class="${fora ? 'fora' : ''}">
                    <td style="width:26px">${ehSub ? '' : ++n}</td>
                    <td class="${ehSub ? 'sub' : ''}">${ehSub ? '↳ ' : ''}${e(r.pergunta_texto)}${catTag}</td>
                    <td style="width:28%"><b>${e(fmtResp(r.resposta))}</b></td>
                    <td style="width:120px">${sit}</td>
                </tr>`;
            }).join('');

            const assinatura = (img, nome, papel, em) => `
                <div class="rel-ass">
                    <div class="rel-ass-img">${img && img !== true ? `<img src="${e(img)}" alt="">` : img === true ? '<i style="color:#1e8e5a">Assinado digitalmente</i>' : '<i style="color:#8a96a3">Pendente</i>'}</div>
                    <div class="rel-ass-linha">${e(nome)}</div>
                    <div class="rel-ass-info">${papel}${em ? ' · assinado em ' + dataHora(em) : ''}</div>
                </div>`;

            document.getElementById('relatorio').innerHTML = `
                <div class="rel-topo">
                    <div class="rel-marca">
                        <img src="frontend/img/logo.png" class="rel-logo" alt="Logo Axion">
                        <div>
                            <div class="rel-marca-nome">AXION</div>
                            <div class="rel-marca-sub">Gestão de Frota &amp; Checklists</div>
                        </div>
                    </div>
                    <div class="rel-doc">
                        <div class="rel-doc-titulo">Relatório de Vistoria</div>
                        <div class="rel-doc-num">Nº ${numero} · Emitido em ${emitido}</div>
                    </div>
                </div>

                <div class="rel-faixa ${ok ? 'ok' : 'nok'}">
                    <span>RESULTADO: ${ok ? 'CONFORME — VEÍCULO LIBERADO' : 'NÃO CONFORME — AVARIA REGISTRADA'}</span>
                    <span class="rel-sit">${nomesSituacao[v.situacao] || ''}</span>
                </div>

                <div class="rel-secao">Identificação</div>
                ${v.veiculo_foto_url ? `<img src="${e(v.veiculo_foto_url)}" alt="" style="float:right;width:46mm;height:34mm;object-fit:cover;border-radius:6px;margin:0 0 6px 8px;border:1px solid #dde3ea">` : ''}
                <table class="rel-grid" style="${v.veiculo_foto_url ? 'width:calc(100% - 50mm)' : ''}">
                    <tr>
                        <td><span class="rot">Placa</span><span class="val" style="font-family:monospace;font-size:12pt">${e(v.placa_veiculo)}</span></td>
                        <td colspan="2"><span class="rot">Veículo</span><span class="val">${e(v.marca_modelo || '-')}</span> ${e(v.ano || '')} ${v.cor ? '· ' + e(v.cor) : ''}</td>
                        <td><span class="rot">Quilometragem</span><span class="val">${Number(v.km_rodado || 0).toLocaleString('pt-BR')} km</span></td>
                    </tr>
                    <tr>
                        <td colspan="2"><span class="rot">Checklist aplicado</span><span class="val">${e(v.checklist_titulo)}</span></td>
                        <td><span class="rot">Categorias</span><span class="val">${e(resumoCatsRel)}</span></td>
                        <td><span class="rot">Data da vistoria</span><span class="val">${dataBR(v.data_vistoria)} ${e((v.hora_vistoria || '').slice(0, 5))}</span></td>
                    </tr>
                    <tr>
                        <td colspan="2"><span class="rot">${v.id_locacao ? 'Cliente' : 'Motorista'}</span><span class="val">${e(v.nome_motorista)}</span></td>
                        <td colspan="2"><span class="rot">${v.id_locacao ? 'Testemunha (supervisor)' : 'Vistoriador / Supervisor'}</span><span class="val">${e(v.nome_vistoriador)}</span></td>
                    </tr>
                    ${v.observacoes ? `<tr><td colspan="4"><span class="rot">Observações</span>${e(v.observacoes)}</td></tr>` : ''}
                </table>

                <div class="rel-secao">Itens inspecionados</div>
                ${linhas ? `<table class="rel-tab">
                    <thead><tr><th>#</th><th>Item</th><th>Resposta</th><th>Situação</th></tr></thead>
                    <tbody>${linhas}</tbody>
                </table>
                <div class="rel-resumo">
                    <div><b>${n}</b><span>itens no checklist</span></div>
                    <div><b>${totalAvaliados - foraPadrao}</b><span>dentro do padrão</span></div>
                    <div><b style="color:${foraPadrao ? '#c0392b' : '#1e8e5a'}">${foraPadrao}</b><span>fora do padrão</span></div>
                </div>` : '<p style="color:#8a96a3">Sem respostas registradas.</p>'}

                ${!ok ? `
                <div class="rel-evitar-quebra">
                    <div class="rel-secao">Descrição da não conformidade</div>
                    <div class="rel-caixa">${e(v.detalhes_nao_conformidade || 'Sem descrição registrada.')}</div>
                    ${v.foto_url ? `<img class="rel-foto" src="${e(v.foto_url)}" alt="Foto da avaria">` : ''}
                    ${Number(v.enviado_manutencao) === 1 ? '<p style="margin:6px 0 0"><b>Encaminhamento:</b> veículo enviado para manutenção na aprovação.</p>' : ''}
                </div>` : ''}

                ${v.situacao === 'recusada' ? `
                <div class="rel-evitar-quebra">
                    <div class="rel-secao">Recusa</div>
                    <div class="rel-caixa cinza"><b>Recusada por ${e(v.recusado_por_nome || '')} em ${dataHora(v.recusado_em)}.</b>\n${e(v.motivo_recusa || '')}</div>
                </div>` : ''}

                <div class="rel-evitar-quebra">
                    <div class="rel-secao">Assinaturas</div>
                    <div class="rel-assinaturas">
                        ${assinatura(v.assinatura_motorista, v.nome_motorista, v.id_locacao ? 'Cliente' : 'Motorista', v.assinado_motorista_em)}
                        ${assinatura(v.assinatura_vistoriador, v.nome_vistoriador, v.id_locacao ? 'Testemunha (supervisor)' : 'Vistoriador / Supervisor', v.assinado_vistoriador_em)}
                    </div>
                </div>

                <div class="rel-rodape">
                    <span>Sistema Axion · Relatório de Vistoria Nº ${numero} · ${e(v.placa_veiculo)}</span>
                    <span>Emitido em ${emitido}</span>
                </div>`;
            tituloArquivo = `Vistoria_${numero}_${v.placa_veiculo}`;
        }

        function imprimirRelatorio() {
            // O título vira o nome sugerido do arquivo PDF
            const original = document.title;
            document.title = tituloArquivo;
            window.print();
            setTimeout(() => { document.title = original; }, 1000);
        }
    </script>
</body>

</html>
