<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Gestor - Axion</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
            <h1 class="h3 mb-3 text-center fw-bold text-dark">Acesso ao Axion</h1>
            <p class="text-muted text-center small mb-3">Portal de Vistorias e Gestão de Frota</p>
            
            <!-- ALERTA DE ERRO VISUAL -->
            <div id="alertaErro" class="alert alert-danger d-none py-2 px-3 small text-center mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> E-mail/CPF ou senha incorretos.
            </div>

            <form action="../backend/processar_login.php" method="post">
                <div class="mb-3">
                    <label for="user" class="form-label fw-semibold">E-mail ou CPF</label>
                    <input type="text" name="txtuser" id="user" class="form-control" placeholder="Digite seu e-mail ou CPF" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label fw-semibold">Senha</label>
                    <input type="password" name="txtsenha" id="senha" class="form-control" placeholder="Digite sua senha" required>
                </div>

                <div class="mb-3 text-end">
                    <a href="esqueciSenha.html" class="text-decoration-none small">Esqueci minha senha</a>
                </div>

                <div class="d-grid gap-2">
                    <input type="submit" value="Entrar no Sistema" class="btn btn-primary fw-semibold py-2">
                </div>
            </form>
        </div>
    </div>

    <!-- JS do Bootstrap e detecção de parâmetros de erro -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('erro') === 'credenciais_invalidas') {
            document.getElementById('alertaErro').classList.remove('d-none');
        }
    </script>
</body>


</html>
