# =============================================================================
# PROJETO INTEGRADOR IFES - SISTEMA AXION (VISTORIA E CHECKLIST VEICULAR)
# Orquestração Docker Compose: Aplicação Web (Apache/PHP) + Banco de Dados (MySQL)
# =============================================================================

version: '3.8'

services:
  # -------------------------------------------------------------
  # Serviço Web: Axion (PHP 8.2 + Apache)
  # -------------------------------------------------------------
  web:
    build: .
    container_name: axion_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=axion_db
      - DB_USER=root
      - DB_PASS=axion_root_2026
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/backend/uploads

  # -------------------------------------------------------------
  # Serviço de Banco de Dados: MySQL 8.0 Oficial
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: axion_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: axion_root_2026
      MYSQL_DATABASE: axion_db
    ports:
      - "3307:3306"
    volumes:
      - axion_db_data:/var/lib/mysql
      # Inicializa o banco com o schema e seeds na primeira inicialização do container
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-paxion_root_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  axion_db_data:
    driver: local
