<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Checklist Dinâmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/axion-pro.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 800px;">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4 text-info">Criar Modelo de Checklist</h1>

                <form action="../backend/checklist/criar_checklist_dinamico.php" method="POST">
                    
                    <!-- Dados Base do Checklist -->
                    <div class="row mb-4">
                        <div class="col-md-8 mb-3">
                            <label for="titulo" class="form-label">Título do Checklist</label>
                            <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: Inspeção Diária de Empilhador" required autofocus>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select id="categoria" name="categoria" class="form-select" required>
                                <option value="Geral">Geral</option>
                                <option value="Mecânica">Mecânica</option>
                                <option value="Elétrica">Elétrica</option>
                                <option value="Estética">Estética</option>
                            </select>
                        </div>
                    </div>

                    <hr class="mb-4">
                    <h5 class="mb-3 text-secondary">Perguntas da Inspeção</h5>

                    <!-- Contentor onde as perguntas dinâmicas vão aparecer -->
                    <div id="perguntas-container">
                        <div class="pergunta-item card p-3 mb-3 border-info">
                            <div class="row">
                                <div class="col-md-8 mb-2">
                                    <label class="form-label">Texto da Pergunta 1</label>
                                    <input type="text" name="perguntas[0][texto]" class="form-control" placeholder="O que deve ser verificado?" required>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <label class="form-label">Tipo de Resposta</label>
                                    <select name="perguntas[0][tipo]" class="form-select" required>
                                        <option value="sim_nao">Sim / Não</option>
                                        <option value="texto">Texto Livre</option>
                                        <option value="numero">Número</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" name="perguntas[0][obrigatorio]" value="1" checked>
                                <label class="form-check-label">Resposta Obrigatória</label>
                            </div>
                        </div>
                    </div>

                    <!-- Botão para adicionar mais campos via JS -->
                    <button type="button" class="btn btn-sm btn-outline-info mb-4" onclick="adicionarPergunta()">
                        + Adicionar Outra Pergunta
                    </button>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-info text-white">Guardar Checklist</button>
                        <a href="../backend/php/oqfazer.php" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
<!-- BARRA DE ACESSIBILIDADE FLUTUANTE -->
    <div class="position-fixed bottom-0 start-0 p-3" style="z-index: 1050;">
        <div class="bg-white p-2 rounded-pill shadow-sm border d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="toggleAltoContraste()" title="Ativar Alto Contraste">
                🌓 Contraste
            </button>
            <div class="vr"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('menos')" title="Diminuir Letra">
                A-
            </button>
            <button type="button" class="btn btn-sm btn-light rounded-pill px-2 text-muted small" onclick="mudarZoom('reset')" title="Restaurar Padrão">
                Zoom
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('mais')" title="Aumentar Letra">
                A+
            </button>
        </div>
    </div>

    <!-- Scripts essenciais no final -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/axion-accessibility.js"></script>

    <!-- Lógica de Adicionar Perguntas Dinâmicas -->
    <script>
        let perguntaIndex = 1;

        function adicionarPergunta() {
            const container = document.getElementById('perguntas-container');
            const html = `
                <div class="pergunta-item card p-3 mb-3 border-info position-relative">
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-2" onclick="this.parentElement.remove()" aria-label="Remover"></button>
                    <div class="row mt-2">
                        <div class="col-md-8 mb-2">
                            <label class="form-label">Texto da Pergunta ${perguntaIndex + 1}</label>
                            <input type="text" name="perguntas[${perguntaIndex}][texto]" class="form-control" placeholder="O que deve ser verificado?" required>
                        </div>
                        <div class="col-md-4 mb-2">
                            <label class="form-label">Tipo de Resposta</label>
                            <select name="perguntas[${perguntaIndex}][tipo]" class="form-select" required>
                                <option value="sim_nao">Sim / Não</option>
                                <option value="texto">Texto Livre</option>
                                <option value="numero">Número</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" name="perguntas[${perguntaIndex}][obrigatorio]" value="1" checked>
                        <label class="form-check-label">Resposta Obrigatória</label>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            perguntaIndex++;
        }
    </script>
</body>
</html>
