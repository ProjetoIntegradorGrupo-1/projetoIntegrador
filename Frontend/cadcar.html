<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo - Axion</title>
    <!-- CSS do Bootstrap e Estilos Profissionais -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/axion-pro.css">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card p-4 shadow-sm" style="max-width: 700px; width: 100%;">

            <h1 class="h4 text-center mb-4">Cadastro de Veículo</h1>

            <form action="../backend/veiculos/processar_cadastro_veiculo.php" method="POST">
                <h5 class="mb-3 text-success">Dados do Veículo</h5>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="placa" class="form-label">Placa</label>
                        <input type="text" id="placa" name="placa" class="form-control text-uppercase" placeholder="ABC-1234" maxlength="8" required autofocus>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="marca" class="form-label">Marca</label>
                        <input type="text" id="marca" name="marca" class="form-control" placeholder="Ex: Fiat" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="modelo" class="form-label">Modelo</label>
                        <input type="text" id="modelo" name="modelo" class="form-control" placeholder="Ex: Uno" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="ano" class="form-label">Ano</label>
                        <input type="number" id="ano" name="ano" class="form-control" placeholder="YYYY" min="1990" max="2100" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cor" class="form-label">Cor</label>
                        <input type="text" id="cor" name="cor" class="form-control" placeholder="Ex: Branco" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="quilometragem" class="form-label">Quilometragem</label>
                        <input type="number" id="quilometragem" name="quilometragem" class="form-control" placeholder="0" min="0" required>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="mb-3 text-success">Documentação <small class="text-muted">(Opcional)</small></h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="renavam" class="form-label">Renavam</label>
                        <input type="text" id="renavam" name="renavam" class="form-control" placeholder="Apenas números" maxlength="11">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="chassi" class="form-label">Chassi</label>
                        <input type="text" id="chassi" name="chassi" class="form-control text-uppercase" maxlength="17">
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success">Cadastrar Veículo</button>
                    <a href="../backend/php/oqfazer.php" class="btn btn-outline-secondary">Voltar ao Menu</a>
                </div>
            </form>

        </div>
    </div>

   <!-- BARRA DE ACESSIBILIDADE FLUTUANTE -->
<div class="position-fixed bottom-0 start-0 p-3" style="z-index: 1050;">
    <div class="bg-white p-2 rounded-pill shadow-sm border d-flex align-items-center gap-2">
        <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="toggleAltoContraste()" title="Ativar Alto Contraste">
            🌓 Contraste
        </button>
        <div class="vr"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('menos')" title="Diminuir Letra">
            A-
        </button>
        <button type="button" class="btn btn-sm btn-light rounded-pill px-2 text-muted small" onclick="mudarZoom('reset')" title="Restorar Padrão">
            Zoom
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('mais')" title="Aumentar Letra">
            A+
        </button>
    </div>
</div>
    <!-- Scripts: Bootstrap e Acessibilidade -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/axion-accessibility.js"></script>
</body>

</html>
