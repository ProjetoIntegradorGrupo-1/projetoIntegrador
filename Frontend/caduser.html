<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Axion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/axion-pro.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="card p-4 shadow-sm" style="max-width: 800px; width: 100%;">

            <h1 class="h4 text-center mb-4">Cadastro de Usuário</h1>

            <form action="../backend/usuarios/processar_cadastro.php" method="post">

                <h5 class="mb-3 text-primary">Dados Pessoais</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite o nome" required autofocus>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="sobrenome" class="form-label">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" class="form-control" placeholder="Digite o sobrenome" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" id="data_nascimento" name="data_nascimento" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="nome@email.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" id="senha" name="senha" class="form-control" placeholder="Crie uma senha" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="perfil" class="form-label">Perfil</label>
                        <select name="perfil" id="perfil" class="form-select" required>
                            <option value="" selected disabled>Selecione o perfil</option>
                            <option value="administrador">Administrador</option>
                            <option value="gestor">Gestor</option>
                            <option value="funcionario">Funcionário</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="mb-3 text-primary">Endereço</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="logradouro" class="form-label">Logradouro (Rua/Av)</label>
                        <input type="text" id="logradouro" name="logradouro" class="form-control" placeholder="Rua exemplo" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text" id="numero" name="numero" class="form-control" placeholder="123" required>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" id="bairro" name="bairro" class="form-control" placeholder="Bairro" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" id="cidade" name="cidade" class="form-control" placeholder="Cidade" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="estado" class="form-label">Estado (UF)</label>
                        <input type="text" id="estado" name="estado" class="form-control" placeholder="ES" maxlength="2" required>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="mb-3 text-primary">CNH <small class="text-muted">(Opcional)</small></h5>
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label for="numero_cnh" class="form-label">Número da CNH</label>
                        <input type="text" id="numero_cnh" name="numero_cnh" class="form-control" placeholder="Número">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="categoria_cnh" class="form-label">Categoria</label>
                        <input type="text" id="categoria_cnh" name="categoria_cnh" class="form-control" placeholder="Ex: AB" maxlength="5">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="validade_cnh" class="form-label">Validade</label>
                        <input type="date" id="validade_cnh" name="validade_cnh" class="form-control">
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
                    <a href="../backend/php/oqfazer.php" class="btn btn-outline-secondary">Voltar ao Menu</a>
                </div>

            </form>
        </div>
    </div>

  <!-- BARRA DE ACESSIBILIDADE FLUTUANTE -->
    <div class="position-fixed bottom-0 start-0 p-3" style="z-index: 1050;">
        <div class="bg-white p-2 rounded-pill shadow-sm border d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="toggleAltoContraste()" title="Ativar Alto Contraste">
                🌓 Contraste
            </button>
            <div class="vr"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('menos')" title="Diminuir Letra">
                A-
            </button>
            <button type="button" class="btn btn-sm btn-light rounded-pill px-2 text-muted small" onclick="mudarZoom('reset')" title="Restaurar Padrão">
                Zoom
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle fw-bold" onclick="mudarZoom('mais')" title="Aumentar Letra">
                A+
            </button>
        </div>
    </div>

    <!-- Scripts essenciais no final -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/axion-accessibility.js"></script>

</body>
</html>

</body>
</html>
