<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Checklist - Axion Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/axion-web.css">
</head>

<body>

    <nav class="axion-navbar text-white">
        <div class="container-fluid px-3 px-lg-5 d-flex justify-content-between align-items-center">
            <a href="oqfazer.php" class="axion-brand">
                <i class="bi bi-truck-front-fill fs-4"></i>
                <span>AXION</span>
                <span class="axion-brand-badge">Editar Checklist</span>
            </a>
            <div class="d-flex gap-2">
                <a href="oqfazer.php?aba=checklists" class="btn btn-sm btn-light fw-semibold"><i class="bi bi-search me-1"></i>Buscar Checklists</a>
                <a href="oqfazer.php" class="btn btn-sm btn-outline-light"><i class="bi bi-grid-1x2 me-1"></i>Painel Principal</a>
            </div>
        </div>
    </nav>

    <main class="axion-web-container">
        <div class="axion-form-card" style="max-width: 960px;">
            <h1 class="h4 fw-bold mb-1"><i class="bi bi-pencil-square text-primary me-2"></i>Editar Modelo de Checklist</h1>
            <p class="text-muted small mb-4">Altere perguntas, respostas esperadas e recomendações de não conformidade.</p>

            <div class="mb-4 p-3 bg-light border rounded">
                <label for="select-checklist" class="form-label fw-bold small">Selecione o Modelo de Checklist Cadastrado</label>
                <select id="select-checklist" class="form-select" onchange="carregarChecklistPorId(this.value)">
                    <option value="">Carregando modelos de checklist...</option>
                </select>
            </div>

            <form action="backend/api.php?acao=salvar_edicao_checklist" method="post" id="formEditarChecklist">
                <input type="hidden" name="id_checklist" id="id_checklist" value="1">

                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label for="tituloChecklist" class="form-label fw-bold">Título do Checklist</label>
                        <input type="text" id="tituloChecklist" name="titulo" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="categoriaChecklist" class="form-label fw-bold">Categoria</label>
                        <select id="categoriaChecklist" name="categoria" class="form-select" required>
                            <option value="eletrico">Elétrico</option>
                            <option value="mecanico">Mecânico</option>
                            <option value="estetico">Estético</option>
                            <option value="seguranca">Segurança</option>
                            <option value="pre_viagem">Pré-Viagem</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="descricaoChecklist" class="form-label fw-bold">Descrição</label>
                        <input type="text" id="descricaoChecklist" name="descricao" class="form-control">
                    </div>
                </div>

                <h2 class="h6 fw-bold mb-3 mt-2">Perguntas do Checklist</h2>
                <div id="containerPerguntas"></div>

                <div class="mb-4 text-center">
                    <button type="button" class="btn btn-outline-success w-100" onclick="adicionarPergunta()">
                        + Acrescentar Nova Pergunta
                    </button>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="oqfazer.php?aba=checklists" class="btn btn-outline-secondary">Cancelar e Voltar</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-check2-circle me-1"></i>Salvar Alterações</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let contadorPerguntas = 0;

        function renderizarBlocoPergunta(idx, p = {}) {
            const texto = p.texto || '';
            const tipo = p.tipo || 'sim_nao';
            const obrig = (p.obrigatorio === undefined || Number(p.obrigatorio) === 1) ? 'checked' : '';
            const esperada = p.resposta_esperada || 'sim';
            const orientacao = p.orientacao || '';
            const ocultaConf = (tipo !== 'sim_nao') ? 'd-none' : '';

            return `
                <div class="card p-3 mb-3 bg-white border pergunta-item" id="pergunta_${idx}">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-primary">Pergunta ${idx}</span>
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerPergunta('pergunta_${idx}')">Excluir</button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Texto da Pergunta</label>
                        <input type="text" name="perguntas[${idx}][texto]" class="form-control" value="${texto.replace(/"/g, '&quot;')}" required>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-6 mb-2">
                            <label class="form-label fw-semibold">Tipo de Resposta</label>
                            <select name="perguntas[${idx}][tipo]" class="form-select" onchange="alternarCamposConformidade(this, ${idx})" required>
                                <option value="sim_nao" ${tipo === 'sim_nao' ? 'selected' : ''}>Sim / Não</option>
                                <option value="texto" ${tipo === 'texto' ? 'selected' : ''}>Texto Curto (Observação)</option>
                                <option value="numero" ${tipo === 'numero' ? 'selected' : ''}>Número (Ex: Quilometragem/Pressão)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2 d-flex align-items-end">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="perguntas[${idx}][obrigatorio]" value="1" id="req_${idx}" ${obrig}>
                                <label class="form-check-label" for="req_${idx}">Resposta Obrigatória</label>
                            </div>
                        </div>
                    </div>
                    <div class="row p-2 mx-0 bg-light border rounded ${ocultaConf}" id="box_conformidade_${idx}">
                        <div class="col-md-4 mb-2">
                            <label class="form-label small fw-bold text-success">Resposta Esperada</label>
                            <select name="perguntas[${idx}][resposta_esperada]" class="form-select form-select-sm">
                                <option value="sim" ${esperada === 'sim' ? 'selected' : ''}>Sim</option>
                                <option value="nao" ${esperada === 'nao' ? 'selected' : ''}>Não</option>
                            </select>
                        </div>
                        <div class="col-md-8 mb-2">
                            <label class="form-label small fw-bold text-warning-emphasis">Orientação se Fora do Padrão (Toast)</label>
                            <input type="text" name="perguntas[${idx}][orientacao]" class="form-control form-control-sm" value="${orientacao.replace(/"/g, '&quot;')}">
                        </div>
                    </div>
                </div>
            `;
        }

        function adicionarPergunta() {
            contadorPerguntas++;
            document.getElementById('containerPerguntas').insertAdjacentHTML('beforeend', renderizarBlocoPergunta(contadorPerguntas));
        }

        function removerPergunta(idElemento) {
            if (document.querySelectorAll('.pergunta-item').length > 1) {
                document.getElementById(idElemento).remove();
            } else {
                alert('O checklist precisa ter pelo menos uma pergunta.');
            }
        }

        function alternarCamposConformidade(selectElemento, idIndex) {
            const box = document.getElementById(`box_conformidade_${idIndex}`);
            if (selectElemento.value === 'sim_nao') box.classList.remove('d-none');
            else box.classList.add('d-none');
        }

        async function inicializarEdicaoChecklist() {
            const resp = await fetch('backend/api.php?acao=buscar&tipo=checklists');
            const json = await resp.json();
            const sel = document.getElementById('select-checklist');
            if (!json.dados || json.dados.length === 0) return;
            sel.innerHTML = json.dados.map(c =>
                `<option value="${c.id_checklist}">#${c.id_checklist} - ${c.titulo} (${c.categoria.toUpperCase()})</option>`
            ).join('');
            const urlId = new URLSearchParams(window.location.search).get('id') || json.dados[0].id_checklist;
            sel.value = urlId;
            carregarChecklistPorId(urlId);
        }

        async function carregarChecklistPorId(id) {
            const resp = await fetch(`backend/api.php?acao=obter_checklist&id=${id}`);
            const json = await resp.json();
            if (!json.dados) return;
            const c = json.dados;
            document.getElementById('id_checklist').value = c.id_checklist;
            document.getElementById('tituloChecklist').value = c.titulo || '';
            document.getElementById('categoriaChecklist').value = c.categoria || 'outros';
            document.getElementById('descricaoChecklist').value = c.descricao || '';

            const cont = document.getElementById('containerPerguntas');
            cont.innerHTML = '';
            contadorPerguntas = 0;
            const lista = (c.perguntas && c.perguntas.length > 0) ? c.perguntas : [{}];
            lista.forEach(p => {
                contadorPerguntas++;
                cont.insertAdjacentHTML('beforeend', renderizarBlocoPergunta(contadorPerguntas, p));
            });
        }

        document.addEventListener('DOMContentLoaded', inicializarEdicaoChecklist);
    </script>
</body>

</html>
